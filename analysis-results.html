<style>
:root{--bg:#FAF9F6;--surface:#EFECE6;--ink:#181716;--ink-soft:#6B6862;--line:#DCD8D0;--accent:#7A1321;--accent-deep:#4E0B14;--accent-ink:#FAF9F6;--font-display:'Cormorant Garamond',Georgia,serif;--font-body:'Plus Jakarta Sans',-apple-system,'Segoe UI',sans-serif;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--surface);color:var(--ink);font-family:var(--font-body);padding:1.2rem 0.8rem 3rem;}
.wrap{max-width:900px;margin:0 auto;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1rem;color:var(--ink);}
.topbar .brand{font-family:var(--font-display);font-weight:500;font-size:1.5rem;letter-spacing:0.03em;}
.dl-btn{background:var(--ink);color:var(--accent-ink);border:none;padding:0.8rem 1.3rem;font:inherit;font-weight:500;letter-spacing:0.05em;cursor:pointer;border-radius:6px;}
.dl-btn:hover{background:var(--accent-deep);}
.dl-ready{background:#ECE8E2;border-radius:10px;padding:0.8rem 1rem;margin:0.8rem 0;text-align:center;font-size:0.9rem;color:#3F3C38;}.dl-ready a{color:#7A1321;font-weight:600;}
.top-actions{display:flex;gap:0.6rem;flex-wrap:wrap;justify-content:flex-end;}.dl-btn.alt{background:transparent;color:var(--ink);border:1px solid var(--ink);}.dl-btn.alt:hover{background:var(--ink);color:var(--accent-ink);}
.dl-btn[disabled]{opacity:0.6;cursor:wait;}
.hint{color:var(--ink-soft);font-size:0.85rem;margin-bottom:1rem;line-height:1.6;}
.loader{text-align:center;padding:4rem 1rem;color:var(--ink);}
.loader .sub{font-size:0.8rem;color:var(--ink-soft);margin-top:0.5rem;}
.spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;margin:0 auto 1rem;animation:spin 0.9s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.err-box{background:var(--bg);padding:2rem;max-width:560px;margin:2rem auto;line-height:1.7;}
.err-box h2{font-family:var(--font-display);margin-bottom:0.6rem;}
.retry-btn{border-radius:6px;margin-top:1rem;padding:0.7rem 1.2rem;border:1px solid var(--accent);background:transparent;cursor:pointer;font:inherit;}
.prev-slot{position:relative;margin:0 auto 1.2rem;overflow:hidden;background:var(--bg);border:1px solid var(--line);}
.prev-slot .pdf-page{transform-origin:top left;}
.cta{background:var(--bg);border:1px solid var(--line);text-align:center;padding:2rem 1.4rem;margin-top:1.4rem;color:var(--ink);}
.cta h3{font-family:var(--font-display);font-weight:500;font-weight:400;font-size:1.5rem;margin-bottom:0.5rem;}
.cta p{font-size:0.9rem;line-height:1.7;margin-bottom:1rem;color:var(--ink-soft);}
.cta a{border-radius:6px;display:inline-block;background:var(--ink);color:var(--accent-ink);padding:0.85rem 1.5rem;text-decoration:none;letter-spacing:0.05em;font-size:0.85rem;}

.pdf-tip{margin-top:0.9rem;padding:0.7rem 1rem;border-left:3px solid #7A1321;background:#ECE8E2;border-radius:0 12px 12px 0;font-size:0.78rem;line-height:1.6;color:#3F3C38;}

<script>
const STORAGE_KEY = 'hsv_analysis_data';
function getSessionId(){return new URLSearchParams(window.location.search).get('session_id');}
function showError(title, message, allowRetry) {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="err-box">
      <h2>${title}</h2>
      <p>${message}</p>
      ${allowRetry ? '<button class="retry-btn" id="retry-btn">Try Again</button>' : ''}
      <p style="margin-top:1rem;">Need help? <a href="contact.html">Contact us</a> and we'll sort it out — if you have paid, your payment is safe either way.</p>
    </div>`;
  const retryBtn = document.getElementById('retry-btn');

  for(let pass=0;pass<4;pass++){
    blocks=makeBlocks(r);
    const host=document.createElement('div');host.className='pdf-page'+(r.__tight?' pdf-tight':'');host.style.cssText='position:absolute;left:-10000px;top:0;height:auto;overflow:visible;';
    host.innerHTML=blocks.map(b=>'<div class="pdf-blk">'+b.html+'</div>').join('');document.body.appendChild(host);
    try{
      if(document.fonts&&document.fonts.ready)await document.fonts.ready;
      await Promise.all([...host.querySelectorAll('img')].map(i=>i.decode?i.decode().catch(()=>{}):Promise.resolve()));
      const kids=[...host.children];blocks.forEach((b,i)=>{b.h=kids[i].offsetHeight;});
    }finally{host.remove();}
    /* in-order packing: keep the reading order, start a new page only when the next section no longer fits */
    pages=[];let cur=[],used=0;
    blocks.forEach(b=>{const need=cur.length?b.h+BLK_GAP:b.h;if(cur.length&&used+need>PAGE_CAP){pages.push(cur);cur=[b];used=b.h;}else{cur.push(b);used+=need;}});
    if(cur.length)pages.push(cur);
    const H=k=>(blocks.find(b=>b.key===k)||{h:0}).h;
    const pgOf=k=>pages.findIndex(pg=>pg.some(b=>b.key===k));
    let changed=false;
    /* First try tighter spacing so the extras still fit; only then give an extra up */
    const wantTight=(r.__x.glance&&H('colortype')+BLK_GAP+H('guidance')>PAGE_CAP)||(r.__x.ribbon&&blocks.some(b=>b.key==='persona')&&pgOf('persona')!==pgOf('palette'));
    if(!r.__tight&&wantTight){r.__tight=true;changed=true;}
    else{
      if(r.__x.glance&&H('colortype')+BLK_GAP+H('guidance')>PAGE_CAP&&pgOf('colortype')===pgOf('guidance')){r.__x.glance=false;changed=true;}
      if(r.__x.lineup&&H('body')>PAGE_CAP){r.__x.lineup=false;changed=true;}
      if(r.__x.ribbon&&blocks.some(b=>b.key==='persona')&&pgOf('persona')!==pgOf('palette')){r.__x.ribbon=false;changed=true;}
    }
    if(!changed)break;
  }
  window.__BLOCK_H=blocks.map(b=>b.key+':'+b.h).join(' ')+' | extras:'+JSON.stringify(r.__x)+' tight:'+r.__tight;
  LAYOUT=pages.map(pg=>pg.map(b=>b.key));
}
function buildPages(r){
  const label='Signature Style Report';
  const today=new Date();const date=today.toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
  const untilD=new Date(today);untilD.setFullYear(untilD.getFullYear()+1);const until=untilD.toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
  const blocks=makeBlocks(r),byKey={};blocks.forEach(b=>{byKey[b.key]=b;});
  const pages=[];
  pages.push(pdfPage('pdf-cover2','<img class="pdf-cover-bg" src="images/report-cover-sig.jpg" alt="">'));
  (LAYOUT||blocks.map(b=>[b.key])).forEach(keys=>{
    const bs=keys.map(k=>byKey[k]);
    pages.push(pdfPage(r.__tight?'pdf-tight':'',bs.map((b,i)=>'<div class="'+(i?'pdf-blk-n':'')+'">'+b.html+'</div>').join('')+pdfFoot(label+' · '+bs.map(b=>b.label).join(' & '))));
  });
  pages.push(pdfPage('pdf-closing','<div class="pdf-logo">HerStyleVault</div><p style="font-family:\'Cormorant Garamond\',serif;font-style:italic;font-size:1.35rem;color:var(--accent);max-width:560px;margin:1.2rem 0 0.4rem;line-height:1.6;">This is your starting point. Take it shopping, take it to your closet, and come back when you want it turned into real outfits.</p>'
    +'<div class="pdf-credit"><strong>Your $40 credit</strong>Your Signature Style Report fee is credited toward any 1:1 package when you book within 12 months (by '+esc(until)+'). One use, on your first package. Mention your report when you book and the $40 comes off your final payment. It cannot be combined with other offers.</div>'
    +'<p style="font-size:0.9rem;color:#3F3C38;margin-top:0.4rem;">With love,<br><strong>HerStyleVault</strong></p>'
    +'<p class="pdf-more-top">Ready for your next step?</p><a class="pdf-pill" data-href="https://herstylevault.com/shop.html" href="https://herstylevault.com/shop.html" target="_blank" rel="noopener"><span>Explore What Else We Offer</span><i><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg></i></a>'));
  return pages;
}
let REPORT=null;
function fitPreviews(){
  const w=Math.min(document.getElementById('wrap').clientWidth,816);const s=w/816;
  document.querySelectorAll('.prev-slot').forEach(el=>{el.style.width=(816*s)+'px';el.style.height=(1056*s)+'px';el.firstElementChild.style.transform='scale('+s+')';});
}
async function renderReport(r){
  REPORT=r;await prepCroq(r);await layoutPages(r);
  const pages=buildPages(r);
  document.getElementById('app').innerHTML='<p class="hint">Your report is ready, and it is yours to keep. We do not store it, so tap <b>Email me my PDF</b> now to put a copy in your inbox. After that, you can look at it any time. Thinking of booking a session? Keep this PDF so you can share it at your consultation.</p>'+pages.map(p=>'<div class="prev-slot">'+p+'</div>').join('')
    +'<div class="cta"><h3>Ready to turn this into outfits?</h3><p>A free consultation turns this report into a real wardrobe. Your $40 is credited toward any 1:1 package if you book within 12 months.</p><a href="'+(r.isReturning?'book.html':'https://tally.so/r/yPeEjp')+'">'+(r.isReturning?'Book Your Session':'Book a Consultation')+'</a></div>';
  fitPreviews();window.addEventListener('resize',fitPreviews);
  /* the PDF goes to the buyer's email; if email sending is ever unavailable we quietly fall back to a download link so nobody is stuck */
  const eb=document.getElementById('email-btn');eb.disabled=false;eb.onclick=()=>emailPdf(eb);
  fetch('/.netlify/functions/send-report?health=1').then(r=>r.json()).then(j=>{if(!(j&&j.ok)){eb.textContent='Get my PDF';eb.onclick=()=>downloadPdf(eb);}}).catch(()=>{eb.textContent='Get my PDF';eb.onclick=()=>downloadPdf(eb);});
}
async function buildPdf(){
  const root=document.getElementById('pdf-root');
  try{
    root.innerHTML=buildPages(REPORT).join('');
    await new Promise(r=>setTimeout(r,80));
    await loadFonts();
    const els=root.querySelectorAll('.pdf-page');const {jsPDF}=window.jspdf;
    const pdf=new jsPDF({unit:'px',format:[816,1056],compress:true});
    pdf.setProperties({title:'Signature Style Report',subject:'Your personalized color and body style report',author:'HerStyleVault',creator:'HerStyleVault'});
    for(let i=0;i<els.length;i++){
      const canvas=await html2canvas(els[i],{scale:2,backgroundColor:'#ffffff',useCORS:true});
      if(i>0)pdf.addPage([816,1056],'portrait');
      pdf.addImage(canvas.toDataURL('image/jpeg',0.92),'JPEG',0,0,816,1056);
      canvas.width=canvas.height=0; /* free memory as we go (helps on phones) */
      const pr=els[i].getBoundingClientRect();
      els[i].querySelectorAll('[data-href]').forEach(el=>{const q=el.getBoundingClientRect();pdf.link(q.left-pr.left,q.top-pr.top,q.width,q.height,{url:el.getAttribute('data-href')});});
    }
    const safe=String(REPORT.clientName||'Client').replace(/[\\/:*?"<>|]/g,'').trim()||'Client';
    return{pdf,fname:safe+' - Signature Style Report.pdf'};
  }finally{root.innerHTML='';}
}
async function downloadPdf(btn){
  const label=btn.textContent;btn.disabled=true;btn.textContent='Building PDF…';
  try{
    const {pdf,fname}=await buildPdf();
    /* Safari (iPhone and Mac) blocks a download that starts after a long wait, so there we show a "tap to download" link instead.
       That tap is a fresh user action, which Safari allows. Other browsers still download automatically. */
    const ua=navigator.userAgent,isSafari=/iP(hone|ad|od)/.test(ua)||(/Safari/.test(ua)&&!/Chrome|Chromium|CriOS|FxiOS|Edg|OPR|Android/.test(ua));
    const blob=new Blob([pdf.output('arraybuffer')],{type:isSafari?'application/octet-stream':'application/pdf'});
    const url=URL.createObjectURL(blob);
    const box=document.getElementById('dl-ready');
    box.innerHTML='Your PDF is ready. <a href="'+url+'" download="'+fname.replace(/"/g,'')+'">Tap here to download it</a>'+'';box.hidden=false;
    if(!isSafari)pdf.save(fname);
  }catch(e){console.error(e);alert('Something went wrong building the PDF. Please try again.');}
  finally{btn.disabled=false;btn.textContent=label;}
}
/* Emails the PDF to the address on the Stripe payment (the server decides the address, never the browser). */
async function emailPdf(btn){
  const label=btn.textContent,box=document.getElementById('dl-ready');btn.disabled=true;btn.textContent='Building your PDF…';
  const say=t=>{box.innerHTML=t;box.hidden=false;};
  try{
    const {pdf}=await buildPdf();
    btn.textContent='Sending…';
    const buf=new Uint8Array(pdf.output('arraybuffer'));let bin='';for(let i=0;i<buf.length;i+=0x8000)bin+=String.fromCharCode.apply(null,buf.subarray(i,i+0x8000));
    const res=await fetch('/.netlify/functions/send-report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sessionId:getSessionId(),pdf:btoa(bin)})});
    const j=await res.json().catch(()=>({}));
    if(res.ok&&j.ok)say('Sent! Check your inbox at <strong>'+esc(j.to)+'</strong>. If you do not see it in a minute or two, look in spam or promotions.');
    else if(res.status===429)say('We have already emailed this report a few times. Please check your inbox and spam folder.');
    else say('We could not send the email just now. Please try again in a minute.');
  }catch(e){console.error(e);say('We could not send the email just now. Please try again in a minute.');}
  finally{btn.disabled=false;btn.textContent=label;}
}
async function init() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="loader">
      <div class="spinner"></div>
      <p>Generating your report...</p>
      <p class="sub">This takes about 20-30 seconds — we're building your personalized color and style analysis now.</p>
      <p class="sub" style="margin-top:.8rem;font-weight:500;">Please stay on this page until your report appears. Leaving early can interrupt it.</p>
    </div>`;

  const sessionId = getSessionId();
  if (!sessionId) {
    showError('We couldn\'t confirm your payment', 'This page needs to be reached through the payment confirmation link. If you just paid, check your email for the receipt link, or reach out below.', false);
    return;
  }

  let data;
  try {
    data = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
  } catch (e) { data = null; }

  if (!data || !data.answers) {
    showError('We couldn\'t find your quiz answers', 'Your answers are kept only in the browser you took the quiz in, so they are missing here, for example if you opened this link in a different browser or app. If you have already paid, your payment is safe. Please open this link in the browser you used for the quiz. If that does not work, <a href="contact.html?topic=My%20Signature%20Style%20Report&note=My%20report%20did%20not%20load%20my%20answers.%20Could%20you%20check%20if%20I%20am%20eligible%20for%20an%20Encore%20Code%3F&ref=' + encodeURIComponent(sessionId) + '">contact us</a> and we will check whether you are eligible for an Encore Code, which lets you retake your Style Report at no charge.', false);
    return;
  }

  try {
    const res = await fetch('/.netlify/functions/generate-report', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        sessionId,
        name: data.name,
        returningClient: data.returningClient,
        answers: data.answers,
        freeText: data.freeText,
        photoBase64: data.photoBase64,
        photoMediaType: data.photoMediaType
      })
    });

    if (!res.ok) {
      const errBody = await res.json().catch(() => ({}));
      if (res.status === 402) {
        showError('Payment not confirmed yet', 'Give it a moment and try again — if this keeps happening, email us and we\'ll take care of it.', true);
      } else {
        showError('Something went wrong generating your report', errBody.error || 'Please try again in a moment.', true);
      }
      return;
    }

    const report = await res.json();
    report.hadPhoto = !!data.photoBase64;
    renderReport(report);
  } catch (e) {
    showError('Something went wrong generating your report', 'Please try again in a moment.', true);
  }
}

init();
</script>
