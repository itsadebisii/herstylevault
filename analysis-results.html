<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Signature Style Report | HerStyleVault</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --blush: #f2d9d0;
  --mauve: #c9a09a;
  --rose: #4e1d27;
  --deep-rose: #4e1d27;
  --cream: #fdf6f0;
  --warm-white: #fff9f6;
  --text-dark: #1a1010;
  --text-mid: #4a2e2e;
  --text-light: #6b4a4a;
  --gold: #e4d2a5;
  --line: rgba(46,20,22,0.14);
  --ok: #5c7a5e;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--rose);
  color: var(--text-dark);
  font-family: 'Jost', sans-serif;
  padding: clamp(0.8rem, 3vw, 2.2rem) clamp(0.6rem, 3vw, 1.4rem) 3rem;
}
.wrap { max-width: 720px; margin: 0 auto; }

.frame { background: var(--warm-white); box-shadow: 0 30px 60px -30px rgba(0,0,0,0.5); overflow: hidden; }
.frame-inner { padding: clamp(1.8rem, 5vw, 2.6rem); }

/* Brand hero — always wine + gold, never overridden by a client's own colors */
.brand-hero { background: radial-gradient(120% 140% at 15% -10%, #6b2938 0%, var(--rose) 55%, #3a1420 100%); padding: clamp(2.2rem, 6vw, 3.2rem) clamp(1.8rem, 5vw, 2.6rem) clamp(2.4rem, 6vw, 3.2rem); position: relative; overflow: hidden; }
.brand-hero::before { content: '✦'; position: absolute; top: 1.4rem; right: 2rem; color: var(--gold); opacity: 0.35; font-size: 1.4rem; }
.brand-hero::after { content: '✦'; position: absolute; bottom: 2.2rem; left: 1.6rem; color: var(--gold); opacity: 0.25; font-size: 1rem; }
.brand-mark { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1.8rem; }
.brand-mark svg { width: 26px; height: 26px; flex-shrink: 0; }
.brand-mark span { font-family: 'Fraunces', serif; font-style: italic; font-size: 1.1rem; color: var(--gold); letter-spacing: 0.02em; }

.rep-badge { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase; color: #d7e8d8; background: rgba(255,255,255,0.1); padding: 0.3rem 0.7rem; margin-bottom: 1.4rem; }
.rep-badge::before { content: '✓'; font-weight: 700; }
.rep-eyebrow { font-size: 0.62rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--gold); margin-bottom: 0.9rem; }
.rep-eyebrow::before, .rep-eyebrow::after { content: '✦'; margin: 0 0.6em; opacity: 0.6; }
.rep-title { font-family: 'Fraunces', serif; font-weight: 300; font-size: clamp(2.1rem, 7vw, 3rem); line-height: 1.1; color: var(--warm-white); margin-bottom: 0.5rem; }
.rep-title em { font-style: italic; color: var(--gold); }
.rep-sub { font-size: 0.82rem; color: rgba(255,249,246,0.65); }

/* Client's own colors — featured content, framed by the brand, not driving it */
.palette-module { background: var(--cream); border-bottom: 1px solid var(--line); padding: 1.4rem clamp(1.8rem, 5vw, 2.6rem); }
.palette-module .rep-eyebrow { color: var(--rose); margin-bottom: 0.7rem; }
.palette-module .rep-eyebrow::before, .palette-module .rep-eyebrow::after { color: var(--gold); }
.palette-band { display: flex; height: 34px; width: 100%; border-radius: 4px; overflow: hidden; box-shadow: 0 8px 18px -12px rgba(46,20,22,0.4); }
.palette-band span { flex: 1; }

.rep-narrative { position: relative; font-family: 'Fraunces', serif; font-size: 1rem; line-height: 1.9; color: var(--text-mid); background: var(--cream); border-left: 3px solid var(--rose); padding: 1.6rem 1.6rem 1.6rem 2.2rem; margin-bottom: 2.2rem; }
.rep-narrative::before { content: '\201C'; position: absolute; top: -0.3rem; left: 0.5rem; font-family: 'Fraunces', serif; font-size: 3.2rem; color: var(--gold); line-height: 1; }
.rep-narrative .tag { display: block; font-family: 'Jost', sans-serif; font-style: normal; font-size: 0.58rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--rose); margin-bottom: 0.7rem; }
.rep-narrative .lede { font-size: 1.15rem; font-weight: 500; display: block; margin-bottom: 0.6rem; }
.rep-narrative .rest { display: block; color: var(--text-mid); }

.rep-section { margin-bottom: 2.2rem; }
.rep-section-label { font-size: 0.62rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--mauve); margin-bottom: 0.5rem; }
.rep-section-title { font-family: 'Fraunces', serif; font-size: 1.2rem; color: var(--text-dark); margin-bottom: 0.8rem; }
.rep-section-body { font-size: 0.82rem; color: var(--text-mid); line-height: 1.8; }

.id-card { background: var(--blush); border: 1px solid rgba(78,29,39,0.15); border-top: 3px solid var(--rose); padding: 1.3rem 1.4rem; position: relative; }
.id-card .rep-section-label { color: var(--rose); }
.id-card .swatch-mini { position: absolute; top: 1.2rem; right: 1.2rem; width: 20px; height: 20px; border-radius: 50%; border: 1px solid rgba(46,20,22,0.2); }

.swatch-row { display: flex; gap: 0.9rem; flex-wrap: wrap; margin-top: 0.9rem; }
.swatch { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; width: 78px; }
.swatch .chip { width: 100%; height: 64px; border-radius: 6px; border: 1px solid var(--line); box-shadow: 0 6px 14px -8px rgba(46,20,22,0.4); }
.swatch .name { font-size: 0.66rem; color: var(--text-mid); text-align: center; line-height: 1.3; }

.rep-list { list-style: none; display: flex; flex-direction: column; gap: 0.9rem; }
.rep-list li { font-size: 0.85rem; color: var(--text-dark); line-height: 1.7; padding: 0.9rem 1rem 0.9rem 1.1rem; background: var(--cream); border-left: 2px solid var(--gold); position: relative; }
.rep-list li .name { font-weight: 500; }
.rep-list .why { display: block; font-size: 0.78rem; color: var(--text-light); font-style: italic; margin-top: 0.3rem; }

/* Look cards — photo example + color-chip card, for silhouettes we have curated reference images for */
.look-card { display: grid; grid-template-columns: 128px 1fr; gap: 1rem; background: var(--cream); border: 1px solid var(--line); overflow: hidden; }
.look-photo-wrap { position: relative; background: #e8dfd6; aspect-ratio: 3/4; }
.look-photo-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
.look-photo-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-family: 'Jost', sans-serif; font-size: 0.56rem; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(26,16,16,0.35); text-align: center; padding: 0.5rem; }
.chip-card { position: absolute; bottom: 0.5rem; left: 0.5rem; width: 60px; background: var(--warm-white); box-shadow: 0 10px 22px -12px rgba(26,16,16,0.55); }
.chip-card .chip-block { height: 26px; }
.chip-card .chip-label { padding: 0.28rem 0.34rem 0.36rem; }
.chip-card .chip-name { display: block; font-family: 'Jost', sans-serif; font-size: 0.5rem; font-weight: 500; letter-spacing: 0.02em; color: var(--text-dark); line-height: 1.3; }
.chip-card .chip-hex { display: block; font-family: 'Jost', sans-serif; font-size: 0.44rem; letter-spacing: 0.03em; color: var(--text-light); margin-top: 0.1rem; }
.look-info { padding: 0.9rem 1rem 0.9rem 0; display: flex; flex-direction: column; justify-content: center; gap: 0.3rem; }
.look-info .name { font-size: 0.85rem; font-weight: 500; color: var(--text-dark); }
.look-info .why { font-size: 0.78rem; color: var(--text-light); font-style: italic; line-height: 1.6; }
@media (max-width: 480px) { .look-card { grid-template-columns: 96px 1fr; } }

.rep-avoid { background: var(--text-dark); color: var(--warm-white); border: none; padding: 1.2rem 1.3rem; font-size: 0.82rem; line-height: 1.8; }
.rep-avoid strong { color: var(--gold); font-weight: 500; }

.rep-two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; }

/* Closing brand CTA — matches the site's final-cta band elsewhere */
.rep-cta { background: var(--rose); text-align: center; padding: clamp(2rem, 6vw, 2.8rem) clamp(1.8rem, 5vw, 2.6rem); }
.rep-cta p.rep-eyebrow { color: var(--gold); }
.rep-cta h3 { font-family: 'Fraunces', serif; font-weight: 300; font-size: clamp(1.4rem, 4vw, 1.8rem); color: var(--warm-white); margin-bottom: 0.8rem; }
.rep-cta h3 em { font-style: italic; color: var(--gold); }
.rep-cta p.copy { font-size: 0.85rem; color: rgba(255,249,246,0.75); max-width: 42ch; margin: 0 auto 1.6rem; line-height: 1.75; }
.rep-cta a.btn-gold { display: inline-block; font-family: 'Jost', sans-serif; font-size: 0.7rem; letter-spacing: 0.18em; text-transform: uppercase; background: var(--gold); color: var(--rose); padding: 0.9rem 2.2rem; text-decoration: none; font-weight: 500; }

.loader { min-height: 50vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.4rem; text-align: center; }
.spinner { width: 36px; height: 36px; border: 2px solid var(--blush); border-top-color: var(--rose); border-radius: 50%; animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loader p { font-family: 'Fraunces', serif; font-size: 1.1rem; color: var(--text-mid); }
.loader .sub { font-family: 'Jost', sans-serif; font-size: 0.8rem; color: var(--text-light); max-width: 40ch; }

.err-box { min-height: 50vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; text-align: center; padding: 2rem; background: var(--warm-white); }
.err-box h2 { font-family: 'Fraunces', serif; font-size: 1.4rem; color: var(--text-dark); }
.err-box p { font-size: 0.85rem; color: var(--text-mid); max-width: 44ch; line-height: 1.8; }
.err-box a { color: var(--rose); font-weight: 500; }
.retry-btn { font-family: 'Jost', sans-serif; font-size: 0.66rem; letter-spacing: 0.16em; text-transform: uppercase; background: var(--rose); color: var(--warm-white); padding: 0.75rem 1.8rem; border: none; cursor: pointer; margin-top: 0.6rem; }

@media (max-width: 600px) { .rep-two-col { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="wrap">
  <div class="frame" id="frame">
    <div class="brand-hero">
      <div class="brand-mark"><svg viewBox="0 0 150 150" aria-hidden="true"><circle cx="75" cy="75" r="50" fill="none" stroke="#e4d2a5" stroke-width="1.6"/><line x1="75" y1="19" x2="75" y2="27" stroke="#e4d2a5" stroke-width="1.7"/><line x1="75" y1="123" x2="75" y2="131" stroke="#e4d2a5" stroke-width="1.7"/><line x1="19" y1="75" x2="27" y2="75" stroke="#e4d2a5" stroke-width="1.7"/><line x1="123" y1="75" x2="131" y2="75" stroke="#e4d2a5" stroke-width="1.7"/><circle cx="75" cy="36" r="4.4" fill="#e4d2a5"/><line x1="75" y1="40.4" x2="75" y2="50" stroke="#e4d2a5" stroke-width="2.3" stroke-linecap="round"/><path d="M75 50 L44 76 Q38 80 44 83 L106 83 Q112 80 106 76 Z" fill="none" stroke="#e4d2a5" stroke-width="2.3" stroke-linejoin="round"/></svg><span>HerStyleVault</span></div>
      <div class="rep-badge">Payment confirmed</div>
      <p class="rep-eyebrow">Signature Style Report</p>
      <h2 class="rep-title">Your report is<br><em>being written</em></h2>
      <p class="rep-sub">This takes about 20-30 seconds — hang tight.</p>
    </div>
    <div class="frame-inner" id="app">
      <div class="loader">
        <div class="spinner"></div>
        <p>Generating your report...</p>
        <p class="sub">We're building your personalized color and style analysis now.</p>
      </div>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'hsv_analysis_data';

function getSessionId() {
  const params = new URLSearchParams(window.location.search);
  return params.get('session_id');
}

function showError(title, message, allowRetry) {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="err-box">
      <h2>${title}</h2>
      <p>${message}</p>
      ${allowRetry ? '<button class="retry-btn" id="retry-btn">Try Again</button>' : ''}
      <p style="margin-top:1rem;">Need help? Email <a href="mailto:hello@herstylevault.com">hello@herstylevault.com</a> and we'll sort it out — your payment is confirmed either way.</p>
    </div>`;
  const retryBtn = document.getElementById('retry-btn');
  if (retryBtn) retryBtn.addEventListener('click', init);
}

function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

// Split the AI narrative into a bold lede (first sentence) + the rest, for readability
function splitLede(text) {
  const match = text.match(/^(.+?[.!?])\s+(.+)$/s);
  if (!match) return { lede: text, rest: '' };
  return { lede: match[1], rest: match[2] };
}

const LOGO_SVG = `<svg viewBox="0 0 150 150" aria-hidden="true"><circle cx="75" cy="75" r="50" fill="none" stroke="#e4d2a5" stroke-width="1.6"/><line x1="75" y1="19" x2="75" y2="27" stroke="#e4d2a5" stroke-width="1.7"/><line x1="75" y1="123" x2="75" y2="131" stroke="#e4d2a5" stroke-width="1.7"/><line x1="19" y1="75" x2="27" y2="75" stroke="#e4d2a5" stroke-width="1.7"/><line x1="123" y1="75" x2="131" y2="75" stroke="#e4d2a5" stroke-width="1.7"/><circle cx="75" cy="36" r="4.4" fill="#e4d2a5"/><line x1="75" y1="40.4" x2="75" y2="50" stroke="#e4d2a5" stroke-width="2.3" stroke-linecap="round"/><path d="M75 50 L44 76 Q38 80 44 83 L106 83 Q112 80 106 76 Z" fill="none" stroke="#e4d2a5" stroke-width="2.3" stroke-linejoin="round"/></svg>`;

// Curated reference photos, matched to silhouette recommendation text by keyword.
// Each has a statement color + a light pairing color pulled from the client's real season data.
const SILHOUETTE_LOOKS = [
  { match: /corset/i, img: null, statement: { n: 'Winterberry', h: '#8b2942' }, pair: { n: 'Chambray Blue', h: '#9eb4c3' } },
  { match: /belt/i, img: null, statement: { n: 'Hot Chocolate', h: '#4a2e20' }, pair: { n: 'Lemon Grass', h: '#a6a24a' } },
  { match: /fit and flare/i, img: null, statement: { n: 'Bronze Brown', h: '#7a4b2a' }, pair: { n: 'Primrose Pink', h: '#eac0c8' } }
];

function findLook(silhouetteText) {
  return SILHOUETTE_LOOKS.find(l => l.match.test(silhouetteText));
}

function chipCard(look) {
  return `<div class="chip-card">
    <div class="chip-block" style="background:${look.statement.h};"></div>
    <div class="chip-block" style="background:${look.pair.h}; height:14px;"></div>
    <div class="chip-label">
      <span class="chip-name">${esc(look.statement.n)}</span>
      <span class="chip-hex">${esc(look.statement.h.toUpperCase())}</span>
    </div>
  </div>`;
}

function renderSilhouette(s) {
  const look = findLook(s.text);
  if (!look) {
    return `<li><span class="name">${esc(s.text)}</span><span class="why">${esc(s.reason)}</span></li>`;
  }
  const photoInner = look.img
    ? `<img src="${esc(look.img)}" alt="${esc(s.text)} example">`
    : `<div class="look-photo-placeholder">Reference photo</div>`;
  return `<li style="padding:0; border-left:none; background:none;">
    <div class="look-card">
      <div class="look-photo-wrap">${photoInner}${chipCard(look)}</div>
      <div class="look-info">
        <span class="name">${esc(s.text)}</span>
        <span class="why">${esc(s.reason)}</span>
      </div>
    </div>
  </li>`;
}

function renderReport(r) {
  const frame = document.getElementById('frame');
  const bandColors = [...(r.signature || []), ...(r.neutrals || [])];
  const { lede, rest } = splitLede(r.narrative);

  frame.innerHTML = `
    <div class="brand-hero">
      <div class="brand-mark">${LOGO_SVG}<span>HerStyleVault</span></div>
      <div class="rep-badge">Payment confirmed</div>
      <p class="rep-eyebrow">Signature Style Report</p>
      <h2 class="rep-title">You're a <em>${esc(r.seasonLabel)}</em>, ${esc(r.clientName)}</h2>
      <p class="rep-sub">${esc(r.bodyShapeLabel)} · Generated from your answers${r.hadPhoto ? ' + photo' : ''}</p>
    </div>

    <div class="palette-module">
      <p class="rep-eyebrow">Your Signature Palette</p>
      <div class="palette-band">${bandColors.map(c => `<span style="background:${c.h};" title="${esc(c.n)}"></span>`).join('')}</div>
    </div>

    <div class="frame-inner">
      <div class="rep-narrative">
        <span class="tag">Why This Is You</span>
        <span class="lede">${esc(lede)}</span>
        ${rest ? `<span class="rest">${esc(rest)}</span>` : ''}
      </div>

      <div class="rep-two-col">
        <div class="rep-section id-card">
          <div class="swatch-mini" style="background:${esc((r.signature && r.signature[0] && r.signature[0].h) || '#4e1d27')};"></div>
          <p class="rep-section-label">Color Type Identified</p>
          <h3 class="rep-section-title">${esc(r.seasonLabel)} ✦</h3>
          <p class="rep-section-body">${esc(r.seasonDesc)} Metal tone: ${esc(r.metal)}.</p>
        </div>
        <div class="rep-section id-card">
          <p class="rep-section-label">Body Shape Identified</p>
          <h3 class="rep-section-title">${esc(r.bodyShapeLabel)} ✦</h3>
          <p class="rep-section-body">${esc(r.bodyShapeDesc)} Goal: ${esc(r.bodyGoal)}</p>
        </div>
      </div>

      <div class="rep-section">
        <p class="rep-section-label">What Makes You Glow</p>
        <h3 class="rep-section-title">Signature Colors</h3>
        <div class="swatch-row">
          ${r.signature.map(n => `<div class="swatch"><div class="chip" style="background:${n.h};"></div><span class="name">${esc(n.n)}</span></div>`).join('')}
        </div>
      </div>

      <div class="rep-section">
        <p class="rep-section-label">Your Wardrobe Base</p>
        <h3 class="rep-section-title">Power Neutrals</h3>
        <div class="swatch-row">
          ${r.neutrals.map(n => `<div class="swatch"><div class="chip" style="background:${n.h};"></div><span class="name">${esc(n.n)}</span></div>`).join('')}
        </div>
      </div>

      <div class="rep-section">
        <p class="rep-section-label">Best Silhouettes For Your Shape</p>
        <h3 class="rep-section-title">Looks That Work For You</h3>
        <ul class="rep-list">
          ${r.silhouettes.map(renderSilhouette).join('')}
        </ul>
      </div>

      <div class="rep-section" style="margin-bottom:0;">
        <p class="rep-section-label">Step Back From</p>
        <div class="rep-avoid">${esc(r.avoidText)}</div>
      </div>
    </div>

    <div class="rep-cta">
      <p class="rep-eyebrow">Ready For More?</p>
      <h3>This is the starting point — <em>let's go deeper</em></h3>
      <p class="copy">A free consultation turns this into an actual wardrobe: real outfits, real pieces, built around you.</p>
      <a class="btn-gold" href="index.html">Book Your Free Consultation ✦</a>
    </div>
  `;
}

async function init() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="loader">
      <div class="spinner"></div>
      <p>Generating your report...</p>
      <p class="sub">This takes about 20-30 seconds — we're building your personalized color and style analysis now.</p>
    </div>`;

  const sessionId = getSessionId();
  if (!sessionId) {
    showError('We couldn\'t confirm your payment', 'This page needs to be reached through the payment confirmation link. If you just paid, check your email for the receipt link, or reach out below.', false);
    return;
  }

  let data;
  try {
    data = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
  } catch (e) { data = null; }

  if (!data || !data.answers) {
    showError('We couldn\'t find your quiz answers', 'Your quiz answers are stored on the device and browser you took the quiz on. If you switched devices or cleared your browser data after paying, email us and we\'ll generate your report manually.', false);
    return;
  }

  try {
    const res = await fetch('/.netlify/functions/generate-report', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        sessionId,
        name: data.name,
        answers: data.answers,
        freeText: data.freeText,
        photoBase64: data.photoBase64,
        photoMediaType: data.photoMediaType
      })
    });

    if (!res.ok) {
      const errBody = await res.json().catch(() => ({}));
      if (res.status === 402) {
        showError('Payment not confirmed yet', 'Give it a moment and try again — if this keeps happening, email us and we\'ll take care of it.', true);
      } else {
        showError('Something went wrong generating your report', errBody.error || 'Please try again in a moment.', true);
      }
      return;
    }

    const report = await res.json();
    report.hadPhoto = !!data.photoBase64;
    renderReport(report);
  } catch (e) {
    showError('Something went wrong generating your report', 'Please try again in a moment.', true);
  }
}

init();
</script>

</body>
</html>
