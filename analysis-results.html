<style>
:root{--bg:#FAF9F6;--surface:#EFECE6;--ink:#181716;--ink-soft:#6B6862;--line:#DCD8D0;--accent:#7A1321;--accent-deep:#4E0B14;--accent-ink:#FAF9F6;--font-display:'Cormorant Garamond',Georgia,serif;--font-body:'Plus Jakarta Sans',-apple-system,'Segoe UI',sans-serif;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--surface);color:var(--ink);font-family:var(--font-body);padding:1.2rem 0.8rem 3rem;}
.wrap{max-width:900px;margin:0 auto;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1rem;color:var(--ink);}
.topbar .brand{font-family:var(--font-display);font-weight:500;font-size:1.5rem;letter-spacing:0.03em;}
.dl-btn{background:var(--ink);color:var(--accent-ink);border:none;padding:0.8rem 1.3rem;font:inherit;font-weight:500;letter-spacing:0.05em;cursor:pointer;border-radius:6px;}
.dl-btn:hover{background:var(--accent-deep);}
.dl-ready{background:#ECE8E2;border-radius:10px;padding:0.8rem 1rem;margin:0.8rem 0;text-align:center;font-size:0.9rem;color:#3F3C38;}.dl-ready a{color:#7A1321;font-weight:600;}
.top-actions{display:flex;gap:0.6rem;flex-wrap:wrap;justify-content:flex-end;}.dl-btn.alt{background:transparent;color:var(--ink);border:1px solid var(--ink);}.dl-btn.alt:hover{background:var(--ink);color:var(--accent-ink);}
.dl-btn[disabled]{opacity:0.6;cursor:wait;}
.hint{color:var(--ink-soft);font-size:0.95rem;margin-bottom:1rem;line-height:1.6;}
.hint-link{color:var(--accent);font-weight:600;text-decoration:underline;}
.dl-btn.nudge{animation:nudge 1.4s ease-in-out 5;}
@keyframes nudge{0%,100%{box-shadow:0 0 0 0 rgba(122,19,33,0)}50%{box-shadow:0 0 0 7px rgba(122,19,33,.28)}}
@media (prefers-reduced-motion:reduce){.dl-btn.nudge{animation:none;box-shadow:0 0 0 3px rgba(122,19,33,.35)}}
.loader{text-align:center;padding:4rem 1rem;color:var(--ink);}
.loader .sub{font-size:0.8rem;color:var(--ink-soft);margin-top:0.5rem;}
.spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;margin:0 auto 1rem;animation:spin 0.9s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.err-box{background:var(--bg);padding:2rem;max-width:560px;margin:2rem auto;line-height:1.7;}
.err-box h2{font-family:var(--font-display);margin-bottom:0.6rem;}
.retry-btn{border-radius:6px;margin-top:1rem;padding:0.7rem 1.2rem;border:1px solid var(--accent);background:transparent;cursor:pointer;font:inherit;}
.gate input{display:block;width:100%;max-width:360px;margin-top:.8rem;padding:.8rem 1rem;border:1px solid var(--line,#DCD8D0);border-radius:6px;font:inherit;background:#fff;}
.gate .gate-msg{min-height:1.4em;margin-top:.8rem;color:#7A1321;font-size:.9rem;}
.gate .gate-fine{font-size:.82rem;color:#5E5A55;}
.gate a{color:var(--accent);}
.save-note .share-row{display:block;margin-top:.6rem;}
.share-btn{display:inline-block;padding:.55rem 1rem;border:1px solid #7A1321;background:#7A1321;color:#fff;border-radius:6px;font:inherit;font-size:.85rem;cursor:pointer;}
.share-btn:hover{background:#4E0B14;}
.link-btn{background:none;border:0;padding:.55rem .6rem;color:#7A1321;font:inherit;font-size:.85rem;text-decoration:underline;cursor:pointer;}
.share-panel{margin-top:.8rem;padding:.8rem 1rem;background:#fff;border:1px solid #DCD8D0;border-radius:6px;}
.share-panel p{margin:0 0 .6rem;}
.share-panel input{padding:.55rem .7rem;border:1px solid #DCD8D0;border-radius:6px;font:inherit;max-width:100%;margin-bottom:.4rem;}
.share-msg{min-height:1.2em;margin:.6rem 0 0;color:#7A1321;font-size:.85rem;}
.share-bar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;align-items:center;gap:.8rem;padding:.7rem 1rem;background:#181716;color:#fff;font-size:.9rem;}
.share-bar a{color:#181716;background:#fff;padding:.45rem .9rem;border-radius:6px;text-decoration:none;font-weight:500;}
.share-pop{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(24,23,22,.6);}
.share-pop-in{position:relative;max-width:420px;width:100%;padding:2rem 1.6rem 1.4rem;background:#FAF9F6;border-radius:10px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35);}
.share-pop-in h2{font-family:var(--font-display,'Cormorant Garamond',serif);font-weight:500;font-size:2rem;line-height:1.1;margin:.3rem 0 .6rem;color:#181716;}
.share-pop-in p{margin:0 0 1rem;line-height:1.5;color:#3F3C38;}
.share-pop-k{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:#7A1321;font-weight:600;}
.share-pop-go{display:block;text-decoration:none;padding:.8rem 1rem;}
.share-pop-later{margin-top:.4rem;}
.share-pop-x{position:absolute;top:8px;right:10px;width:34px;height:34px;border:0;background:none;font-size:1.6rem;line-height:1;cursor:pointer;color:#3F3C38;}

.save-note{max-width:720px;margin:0 auto 1rem;padding:.7rem 1rem;background:#FAF9F6;border:1px solid #DCD8D0;border-radius:6px;font-size:.85rem;line-height:1.5;color:#3F3C38;}
.prev-slot{position:relative;margin:0 auto 1.2rem;overflow:hidden;background:var(--bg);border:1px solid var(--line);}
.prev-slot .pdf-page{transform-origin:top left;}
.cta{background:var(--bg);border:1px solid var(--line);text-align:center;padding:2rem 1.4rem;margin-top:1.4rem;color:var(--ink);}
.cta h3{font-family:var(--font-display);font-weight:500;font-weight:400;font-size:1.5rem;margin-bottom:0.5rem;}
.cta p{font-size:0.9rem;line-height:1.7;margin-bottom:1rem;color:var(--ink-soft);}
.cta a{border-radius:6px;display:inline-block;background:var(--ink);color:var(--accent-ink);padding:0.85rem 1.5rem;text-decoration:none;letter-spacing:0.05em;font-size:0.85rem;}

.pdf-logo{font-family:'Cormorant Garamond',serif;font-size:2.9rem;font-weight:500;color:#181716;letter-spacing:0.03em;margin-bottom:0.4rem;}
.pdf-pkg-pill{display:inline-block;padding:0.55rem 1.5rem;background:#181716;color:#FAF9F6;font-size:0.72rem;letter-spacing:0.2em;text-transform:uppercase;margin:1.3rem 0;border-radius:2px;}
.pdf-client-name{font-family:'Cormorant Garamond',serif;font-size:2.7rem;font-style:italic;font-weight:500;color:#7A1321;margin-top:1.4rem;}

.pdf-head{position:absolute;top:20px;left:64px;right:64px;text-align:center;font-size:0.58rem;letter-spacing:0.26em;text-transform:uppercase;color:#6B6862;padding-bottom:9px;border-bottom:1px solid #7A1321;}
.pdf-foot{position:absolute;bottom:40px;left:64px;right:64px;display:flex;justify-content:center;font-size:0.56rem;letter-spacing:0.22em;text-transform:uppercase;color:#6B6862;border-top:1px solid #7A1321;padding-top:10px;}
.pdf-h1{font-family:'Cormorant Garamond',serif;font-size:2.5rem;color:#181716;margin-bottom:0.5rem;font-weight:500;line-height:1.08;}

.pdf-box{background:#ECE8E2;border:none;border-radius:12px;padding:1rem 1.3rem;margin-bottom:0.9rem;font-size:0.82rem;line-height:1.7;color:#3F3C38;}
.pdf-chip-store{color:#8A8378;font-size:0.9em;}.pdf-three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:0.3rem;}.pdf-three .pdf-box{margin-bottom:0;padding:0.8rem 0.95rem;font-size:0.78rem;line-height:1.6;}.pdf-metal{margin:1rem 0 0;font-size:0.82rem;color:#3F3C38;border-top:1px solid #DCD8D0;padding-top:0.8rem;}.pdf-metal span{display:inline-block;font-size:0.64rem;letter-spacing:0.16em;text-transform:uppercase;color:#7A1321;font-weight:500;margin-right:0.8rem;}.pdf-neu .pdf-arch{width:56px;height:62px;border-radius:28px 28px 4px 4px;}.pdf-neu{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}.pdf-neu .pdf-sw{width:auto;margin:0;}

.pdf-metalrow{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:1rem;border-top:1px solid #DCD8D0;padding-top:0.8rem;align-items:start;}.pdf-metalc p{margin:0;font-size:0.8rem;color:#3F3C38;line-height:1.5;}
.pdf-mini-label{font-size:0.62rem!important;letter-spacing:0.16em;text-transform:uppercase;color:#7A1321!important;font-weight:500;margin:0 0 0.35rem!important;}
.pdf-acc-row{display:flex;gap:12px;}.pdf-accc{text-align:center;width:72px;}.pdf-accc i{display:block;width:36px;height:36px;border-radius:50%;margin:0 auto 4px;border:1px solid #CDBBA8;}.pdf-accc span{display:block;font-size:0.62rem;line-height:1.25;color:#3F3C38;}.pdf-accc em{display:block;font-style:normal;font-size:0.56rem;color:#8A8378;}
.pdf-avsw{display:flex;gap:8px;margin-top:0.7rem;padding-top:0.6rem;border-top:1px solid #DCD8D0;}.pdf-avsw div{text-align:center;flex:1;}.pdf-avsw i{display:block;width:28px;height:28px;border-radius:50%;margin:0 auto 3px;border:1px solid #CDBBA8;}.pdf-avsw span{display:block;font-size:0.58rem;line-height:1.2;color:#3F3C38;}.pdf-avsw em{display:block;font-style:normal;font-size:0.52rem;color:#8A8378;}
.pdf-tip{margin-top:0.9rem;padding:0.7rem 1rem;border-left:3px solid #7A1321;background:#ECE8E2;border-radius:0 12px 12px 0;font-size:0.78rem;line-height:1.6;color:#3F3C38;}
.pdf-curated{font-size:0.62rem;letter-spacing:0.16em;color:#7A1321;font-weight:500;margin:-0.1rem 0 0.8rem;}
.pdf-two{display:grid;grid-template-columns:1fr 1fr;gap:0 28px;}.pdf-blk-n{margin-top:20px;padding-top:20px;border-top:1px solid #DCD8D0;}.pdf-pal-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:0.9rem;}.pdf-pal-tag{font-size:0.66rem;letter-spacing:0.16em;text-transform:uppercase;color:#7A1321;font-weight:500;}
.pdf-list{list-style:none;padding:0;margin:0;}

    const eb=document.getElementById('email-btn');if(eb)eb.style.display='none'; // the buyer's email button is not for visitors
    const n=document.getElementById('save-note');
    if(n){n.innerHTML='<span><strong>'+first+'</strong> shared this report with you. Scroll down to see all of it.</span>';n.hidden=false;}
    const rh=document.getElementById('report-hint');if(rh)rh.remove();
    /* the one button that is always there */
    const bar=document.createElement('div');bar.className='share-bar';bar.innerHTML='<span>Liked what you saw?</span> <a href="'+QUIZ_URL+'">Get my own report</a>';document.body.appendChild(bar);
    /* the pop-up: once, after 5 seconds or when they scroll near the end, whichever comes first */
    let seen=false;try{seen=sessionStorage.getItem('hsv_share_popup')==='1';}catch(e){}
    if(!seen){
      let fired=false;
      const fire=()=>{if(fired)return;fired=true;clearTimeout(tm);window.removeEventListener('scroll',onScroll);openSharePopup(first);};
      const onScroll=()=>{const doc=document.documentElement;if(window.scrollY+window.innerHeight>=doc.scrollHeight-700)fire();};
      const tm=setTimeout(fire,5000);
      window.addEventListener('scroll',onScroll,{passive:true});
    }
  }catch(e){
    if(tb)tb.style.display='none';
    app.innerHTML='<div class="err-box"><h2>We could not open this report</h2><p>Please try again in a moment.</p></div>';
  }
}
function openSharePopup(first){
  if(document.getElementById('share-pop'))return;
  const prev=document.activeElement;
  const m=document.createElement('div');m.id='share-pop';m.className='share-pop';m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');m.setAttribute('aria-labelledby','share-pop-t');
  m.innerHTML='<div class="share-pop-in"><button type="button" class="share-pop-x" aria-label="Close">&times;</button><p class="share-pop-k">'+first+' shared this with you</p><h2 id="share-pop-t">Want your own style report?</h2><p>Find your colors, your best silhouettes and where to shop them. It takes about five minutes.</p><a class="share-btn share-pop-go" href="'+QUIZ_URL+'">Take the 5-minute quiz</a><button type="button" class="link-btn share-pop-later">Keep reading</button></div>';
  document.body.appendChild(m);
  try{sessionStorage.setItem('hsv_share_popup','1');}catch(e){}
  const close=()=>{document.removeEventListener('keydown',onKey);if(m.parentNode)m.parentNode.removeChild(m);if(prev&&prev.focus)try{prev.focus();}catch(e){}};
  const onKey=(e)=>{
    if(e.key==='Escape'){close();return;}
    if(e.key==='Tab'){const f=m.querySelectorAll('a[href],button');if(!f.length)return;const first=f[0],last=f[f.length-1];
      if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}
  };
  document.addEventListener('keydown',onKey);
  m.querySelector('.share-pop-x').onclick=close;m.querySelector('.share-pop-later').onclick=close;
  m.addEventListener('click',(e)=>{if(e.target===m)close();});
  m.querySelector('.share-pop-go').focus();
}
async function init() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="loader">
      <div class="spinner"></div>
      <p>Generating your report...</p>
      <p class="sub">This takes about 20-30 seconds — we're building your personalized color and style analysis now.</p>
      <p class="sub" style="margin-top:.8rem;font-weight:500;">Please stay on this page until your report appears. Leaving early can interrupt it.</p>
    </div>`;

  const shareTok = new URLSearchParams(window.location.search).get('share');
  if (shareTok) { await showShared(shareTok); return; }

  const sessionId = getSessionId();
  if (!sessionId) {
    showError('We couldn\'t confirm your payment', 'This page needs to be reached through the payment confirmation link. If you just paid, check your email for the receipt link, or reach out below.', false);
    return;
  }

  const PREVIEW = new URLSearchParams(window.location.search).get('preview') === '1';
  if (PREVIEW) { const nb = document.createElement('div'); nb.style.cssText = 'background:#7A1321;color:#fff;font:600 12px/1.4 sans-serif;text-align:center;padding:8px 12px;position:sticky;top:0;z-index:50'; nb.textContent = 'PREVIEW TEST: not a real purchase. Nothing is saved or emailed.'; document.body.prepend(nb); }
  const cached = PREVIEW ? null : readCache(sessionId);
  if (cached) { REPORT_SAVED = true; SHARE_TOKEN = cached.share || null; await renderReport(cached.report); showSavedNote(); return; }

  let data;
  try {
    data = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
  } catch (e) { data = null; }

  AGE = (data && data.answers && data.answers.ageBracket) || '';
  if (PREVIEW && (!data || !data.answers || new URLSearchParams(window.location.search).get('sample') === '1')) { data = SAMPLE_DATA; AGE = '25-34'; }
  if (!data || !data.answers) {
    // Opened on a different phone or browser: the saved copy opens with the email used at checkout.
    showGate(sessionId);
    return;
  }

  try {
    const res = await fetch('/.netlify/functions/generate-report', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        sessionId,
        name: data.name,
        returningClient: data.returningClient,
        answers: data.answers,
        freeText: data.freeText,
        photoBase64: data.photoBase64,
        photoMediaType: data.photoMediaType,
        previewTest: PREVIEW
      })
    });

    if (!res.ok) {
      const errBody = await res.json().catch(() => ({}));
      if (res.status === 409) { showGate(sessionId, 'This report was already created. Enter the email you used at checkout to open it.'); return; }
      if (res.status === 402) {
        showError('Payment not confirmed yet', 'Give it a moment and try again — if this keeps happening, email us and we\'ll take care of it.', true);
      } else {
        showError('Something went wrong generating your report', errBody.error || 'Please try again in a moment.', true);
      }
      return;
    }

    const report = await res.json();
    report.hadPhoto = !!data.photoBase64;
    SHARE_TOKEN = report.shareToken || null; delete report.shareToken;
    if (res.headers.get('x-hsv-saved') === '1') { REPORT_SAVED = true; writeCache(sessionId, report, SHARE_TOKEN); showSavedNote(); }
    if (data.photoBase64) report.__photo = 'data:' + (data.photoMediaType || 'image/jpeg') + ';base64,' + data.photoBase64;
    await renderReport(report);
  } catch (e) {
    showError('Something went wrong generating your report', 'Please try again in a moment.', true);
  }
}

init();
</script>
