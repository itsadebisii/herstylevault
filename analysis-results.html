<style>

<div class="wrap" id="wrap">
  <div class="topbar"><span class="brand">HerStyleVault</span><button class="dl-btn" id="dl-btn" disabled>Download PDF</button></div>
  <div id="app"><div class="loader"><div class="spinner"></div><p>Generating your report...</p><p class="sub">This takes about 20 to 30 seconds. We're building your personalized color and style analysis now.</p></div></div>
</div>
<div id="pdf-root"></div>
<script>
const STORAGE_KEY = 'hsv_analysis_data';
function getSessionId(){return new URLSearchParams(window.location.search).get('session_id');}
function showError(title, message, allowRetry) {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="err-box">
      <h2>${title}</h2>
      <p>${message}</p>
      ${allowRetry ? '<button class="retry-btn" id="retry-btn">Try Again</button>' : ''}
      <p style="margin-top:1rem;">Need help? Email <a href="mailto:hello@herstylevault.com">hello@herstylevault.com</a> and we'll sort it out — your payment is confirmed either way.</p>
    </div>`;
  const retryBtn = document.getElementById('retry-btn');
  if (retryBtn) retryBtn.addEventListener('click', init);
}


function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
const pdfEsc=esc;
/* ===== Continuous-line body croquis (parametric, one drawing per computed shape) ===== */
const CROQ_SHAPES={
  hourglass:{s:21,b:19.5,w:12.5,h:21.5},
  pear:{s:18.5,b:16.5,w:12.5,h:24},
  apple:{s:20.5,b:20.5,w:19.5,h:19},
  rectangle:{s:20.5,b:18,w:17,h:19.5},
  inverted:{s:26,b:21.5,w:15,h:16.5}
};
const CROQ_Y={neck:36,sh:44.5,pit:62,bust:72,waist:98,hip:129,crotch:142,knee:184,ankle:238,toe:251};
function croqCR(pts){
  let d='M'+pts[0][0].toFixed(2)+' '+pts[0][1].toFixed(2);
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6],c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];
    d+=' C'+c1[0].toFixed(2)+' '+c1[1].toFixed(2)+' '+c2[0].toFixed(2)+' '+c2[1].toFixed(2)+' '+p2[0].toFixed(2)+' '+p2[1].toFixed(2);
  }return d;
}
function croqRuns(P){
  const {s,b,w,h}=P;
  const A=Math.max(s,h*0.98+1);
  const arm=[[45.6,31],[46.2,38],[50-s*0.62,42.6],[50-s,45],[50-s-1.2,56],[50-(A+1.6),78],[50-(A+2.6),98],[50-(A+3.4),116],[50-(A+4),130],[50-(A+4.3),139],[50-(A+3.4),146]];
  const knee=10.2,ss=t=>t*t*(3-2*t);
  const thigh=[139,150,161,172,184,196].map(y=>{const t=Math.min(1,Math.max(0,(y-129)/67));return [50-(knee+(h-knee)*(1-ss(t))),y];});
  const torso=[[50-b+0.4,61],[50-b,72],[50-(b+w)/2-0.5,86],[50-w,98],[50-(w+h)/2-0.6,114],[50-h,129]].concat(thigh).concat([[50-9.1,208],[50-7.6,220],[50-6.2,230],[50-5.6,238]]);
  const foot=[[50-5.6,238],[50-7.2,246],[50-13,251.5],[50-4.6,250.5],[50-3.2,238]];
  const inner=[[50-3.2,238],[50-4,222],[50-4.8,204],[50-4,186],[50-3,166],[50-1.8,150],[50,141]];
  return [arm,torso,foot,inner];
}
function croqMirror(run){return run.map(p=>[100-p[0],p[1]]).reverse();}
function croqPath(P){
  const L=croqRuns(P);const R=L.slice().reverse().map(croqMirror);
  return L.concat(R).map(r=>croqCR(r)).map((d,i)=>i===0?d:d.replace(/^M/,'L')).join(' ');
}
// opt: stroke, sw, arrows (proportion guides), k (height scale), d (intensity -1..1)
function croquisSVG(key,opt){
  opt=opt||{};const P=Object.assign({},CROQ_SHAPES[key]||CROQ_SHAPES.hourglass);const k=opt.k||1,d=opt.d||0;
  if(key==='hourglass'||key==='pear')P.w-=1.2*d; if(key==='apple')P.w+=1.2*d; if(key==='inverted')P.s+=1.5*d;
  const stroke=opt.stroke||'#4B1515',sw=opt.sw||0.9;
  const guides=opt.arrows?[[CROQ_Y.sh,P.s],[CROQ_Y.waist,P.w],[CROQ_Y.hip,P.h]].map(([y,hw])=>{
    const x1=50-hw,x2=50+hw;
    return `<line x1="3" x2="97" y1="${y}" y2="${y}" stroke="#CDBBA8" stroke-width=".4" stroke-dasharray="1.4 1.4"/><path d="M${x1+.8} ${y}H${x2-.8}M${x1+.8} ${y}l2.2-1.3M${x1+.8} ${y}l2.2 1.3M${x2-.8} ${y}l-2.2-1.3M${x2-.8} ${y}l-2.2 1.3" stroke="#8C7A5E" stroke-width=".7" fill="none" stroke-linecap="round"/>`;}).join(''):'';
  const body=`<g transform="translate(50 256) scale(${k}) translate(-50 -256)"><ellipse cx="50" cy="17.5" rx="8.6" ry="11" fill="none" stroke="${stroke}" stroke-width="${sw}"/><path d="${croqPath(P)}" fill="none" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round"/>${guides}</g>`;
  return `<svg viewBox="0 -24 100 284" xmlns="http://www.w3.org/2000/svg">${body}</svg>`;
}
function croqOpts(BAx){const k={petite:0.92,tall:1.08}[BAx&&BAx.height]||1;const d={defined:1,soft:0,plain:-1}[BAx&&BAx.intensity];return{k,d:d===undefined?0:d};}
function croqDataUri(shape,BAx,extra){return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(croquisSVG(shape,Object.assign({arrows:true},croqOpts(BAx),extra||{})));}
// Percent positions (of the image height) for the three proportion labels, matching the drawing's height scale.


function croqLabelPos(BAx){const k=croqOpts(BAx).k;const f=y=>((256+(y-256)*k)+24)/284*100;return{sh:f(CROQ_Y.sh),waist:f(CROQ_Y.waist),hip:f(CROQ_Y.hip)};}
// PNG for the PowerPoint (transparent background, light line for the dark frame)
function croqPng(shape,BAx,w,h,stroke,extra){
  return new Promise((res,rej)=>{const svg=croquisSVG(shape,Object.assign({stroke:stroke||'#F4EFEA',sw:1.1},croqOpts(BAx),extra||{}));
    const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');const r=Math.min(w/img.width,h/img.height);const iw=img.width*r,ih=img.height*r;x.drawImage(img,(w-iw)/2,(h-ih)/2,iw,ih);res(c.toDataURL('image/png'));};img.onerror=rej;
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg.replace('<svg ','<svg width="1000" height="2840" '));});
}


const CROQ_CACHE={};
function croqKey(shape,b){return shape+'|'+(b.height||'')+'|'+(b.intensity||'');}
async function prepCroq(r){const b={height:r.height,intensity:r.intensity};CROQ_CACHE[croqKey(r.bodyShapeKey,b)]=await croqPng(r.bodyShapeKey,b,600,1704,'#4B1515',{arrows:true,sw:1.0});return b;}
const SHAPE_WORD={hourglass:'Hourglass',pear:'Pear',apple:'Apple',rectangle:'Rectangle',inverted:'Inverted Triangle'};
function shapeTitle(r){const w=SHAPE_WORD[r.bodyShapeKey]||'';return r.intensity==='defined'?'Defined '+w:r.intensity==='soft'?'Soft '+w:w;}
function pdfList(arr){return '<ul class="pdf-list">'+(arr||[]).map(i=>'<li>'+esc(i)+'</li>').join('')+'</ul>';}
function pdfFoot(label){return '<div class="pdf-foot"><span>HerStyleVault</span><span>'+esc(label)+'</span></div>';}
function pdfPage(cls,inner){return '<div class="pdf-page '+(cls||'')+'">'+inner+'</div>';}
function arches(arr){return '<div class="pdf-swatches">'+arr.map(c=>'<div class="pdf-sw"><div class="pdf-arch" style="background:'+esc(c.h)+'"></div><div class="pdf-sw-label">'+esc(c.n)+'</div><div class="pdf-sw-hex">'+esc(String(c.h||'').toUpperCase())+'</div></div>').join('')+'</div>';}
function shopChips(r){
  /* live searches at stores that fit her age bracket and price comfort (built on the server); older reports fall back to Nordstrom */
  let links=r.shopLinks;
  if(!links||!links.length){
    const kws=String(r.shopKeywords||'').split(',').map(t=>t.trim()).filter(Boolean).slice(0,6),sig=r.signature.slice(0,5);
    links=kws.map((k,i)=>{const q=sig[i%sig.length].n+' '+k;return{q,store:'Nordstrom',url:'https://www.nordstrom.com/sr?keyword='+encodeURIComponent(q)};});
  }
  return '<div class="pdf-chips">'+links.map(l=>'<a class="pdf-chip" data-href="'+esc(l.url)+'" href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.q)+' <span class="pdf-chip-store">at '+esc(l.store)+'</span></a>').join('')+'</div>';
}
/* ---- Tight layout: sections are measured and packed onto as few pages as fit, so no page is left half empty ---- */
const PAGE_CAP=915, BLK_GAP=41; /* content height that fits above the footer; px added between stacked sections */

  const sig=r.signature.slice(0,5),neu=r.neutrals.slice(0,3);
  const season=String(r.seasonLabel||'');
  const b={height:r.height,intensity:r.intensity};
  const img=CROQ_CACHE[croqKey(r.bodyShapeKey,b)]||'';const CL=croqLabelPos(b);
  const L=[];
  const curated=('Curated for '+((r.personaAnswered&&r.persona)?r.persona.name+' \u00b7 ':'')+((r.shopTier&&r.shopTier.label)||'Mid-range ($75\u2013$200)')).toUpperCase();
  if(r.personaAnswered&&r.persona){const ps=r.persona;L.push({key:'persona',label:'Style Persona',html:'<p class="pdf-section-label" style="margin-top:0;">Your Style Persona</p><div class="pdf-persona-name">'+esc(ps.name)+'</div><p class="pdf-persona-tag">'+esc(ps.tagline)+'</p><p class="pdf-section-label">Your 3-Piece Signature Formula</p><div class="pdf-formula">'+ps.formula.map((f,i)=>(i?'<span class="pdf-plus">+</span>':'')+'<div class="pdf-fbox"><span class="pdf-fnum">0'+(i+1)+'</span>'+esc(f)+'</div>').join('')+'</div><div class="pdf-rulebox"><p class="pdf-section-label" style="margin-top:0;">The Styling Rule You Can Break</p><p>'+esc(ps.rule)+'</p></div>'});}
  const hexOf=c=>esc(String(c.h||'').toUpperCase());
  const neuRow='<div class="pdf-neu">'+r.neutrals.slice(0,4).map(c=>'<div class="pdf-sw"><div class="pdf-arch" style="background:'+esc(c.h)+'"></div><div class="pdf-sw-label">'+esc(c.n)+'</div><div class="pdf-sw-hex">'+hexOf(c)+'</div></div>').join('')+'</div>';
  const sigGrid='<div class="pdf-sig">'+r.signature.slice(0,6).map(c=>'<div class="pdf-sigc"><div class="pdf-arch pdf-arch-s" style="background:'+esc(c.h)+'"></div><div><div class="pdf-sw-label">'+esc(c.n)+'</div><div class="pdf-sw-hex">'+hexOf(c)+'</div></div></div>').join('')+'</div>';
  const accStrip=(r.accents&&r.accents.length)?'<div class="pdf-acc"><p class="pdf-mini-label">Accent tones</p><div class="pdf-acc-row">'+r.accents.slice(0,3).map(c=>'<div class="pdf-accc"><i style="background:'+esc(c.h)+'"></i><span>'+esc(c.n)+'</span><em>'+hexOf(c)+'</em></div>').join('')+'</div></div>':'';
  L.push({key:'palette',label:'Color Palette',html:'<div class="pdf-pal-head"><h1 class="pdf-h1" style="margin:0;">Your <em>Palette</em></h1><span class="pdf-pal-tag">'+esc(season)+'</span></div><p class="pdf-section-label" style="margin-top:0;">Power Neutrals</p>'+neuRow+'<p class="pdf-section-label">Signature Colors</p>'+sigGrid+'<div class="pdf-metalrow"><div class="pdf-metalc"><p class="pdf-mini-label">Metal tone</p><p>'+esc(r.metal)+'</p></div>'+accStrip+'</div>'});
  L.push({key:'colortype',label:'Color Analysis',html:'<div class="pdf-colorband"><p class="pdf-section-label">Color Type</p><h1>You\'re a <em>'+esc(season)+'</em></h1></div>'
    +'<div class="pdf-box">'+esc(r.seasonDesc)+'</div>'
    +'<p class="pdf-section-label">Why This Is You</p><div class="pdf-box">'+esc(r.narrative)+'</div>'});
  const avSw=(r.avoidSwatches&&r.avoidSwatches.length)?'<div class="pdf-avsw">'+r.avoidSwatches.slice(0,4).map(c=>'<div><i style="background:'+esc(c.h)+'"></i><span>'+esc(c.n)+'</span><em>'+hexOf(c)+'</em></div>').join('')+'</div>':'';
  const matureTip=(r.ageBracket==='45+')?'<div class="pdf-tip"><strong>Near your face:</strong> choose softer, light-reflecting shades, like champagne, pearl or a soft version of your signature colors. They bounce light back onto your skin and keep your face bright.</div>':'';
  L.push({key:'guidance',label:'Color Guidance',html:'<h1 class="pdf-h1" style="margin-top:0;">Accessories &amp; <em>Avoid</em></h1><p class="pdf-section-label" style="margin-top:0;">Accessory Color Guide</p><div class="pdf-box">'+esc(r.accessory)+'</div><div class="pdf-two"><div><p class="pdf-section-label">Colors to Avoid</p><div class="pdf-box">'+esc(r.colorAvoid)+avSw+'</div></div><div><p class="pdf-section-label">Step Back From</p><div class="pdf-box">'+esc(r.avoidText)+'</div></div></div>'+matureTip});
  L.push({key:'body',label:'Body Analysis',html:'<p class="pdf-section-label" style="margin-top:0;">Body Shape</p><div class="pdf-bodyrow"><div class="pdf-croq"><img src="'+img+'"/><span class="pdf-croq-lbl" style="top:'+CL.sh.toFixed(1)+'%">Shoulders</span><span class="pdf-croq-lbl" style="top:'+CL.waist.toFixed(1)+'%">Waist</span><span class="pdf-croq-lbl" style="top:'+CL.hip.toFixed(1)+'%">Hips</span></div>'
    +'<div class="pdf-bodycol"><h1 class="pdf-h1" style="margin:0 0 0.7rem;">'+esc(shapeTitle(r))+'</h1><div class="pdf-box">'+esc(r.bodyShapeDesc)+'</div><p class="pdf-section-label">Why This Is You</p><div class="pdf-box">'+esc(r.bodyNarrative)+'</div><p class="pdf-section-label">Styling Goal</p><div class="pdf-box" style="font-style:italic;">'+esc(r.bodyGoal)+'</div></div></div>'
    +'<p class="pdf-section-label">Tops &amp; Necklines</p>'+pdfList((r.bodyGuide.tops||[]).slice(0,4))});
  L.push({key:'silh',label:'Silhouettes & Shopping',html:'<h1 class="pdf-h1" style="margin-top:0;font-size:1.7rem;">Silhouettes &amp; <em>Shopping</em></h1><p class="pdf-curated">'+esc(curated)+'</p><p class="pdf-section-label" style="margin-top:0;">Best Silhouettes For Your Shape</p>'+'<div class="pdf-three">'+(r.silhouettes||[]).map(s=>'<div class="pdf-box"><strong>'+esc(s.text)+'</strong><br>'+esc(s.reason)+'</div>').join('')+'</div>'
    +'<div class="pdf-two"><div><p class="pdf-section-label">Bottoms</p>'+pdfList((r.bodyGuide.bots||[]).slice(0,4))+'</div><div><p class="pdf-section-label">Shop Your Colors &amp; Cuts</p><p style="font-size:0.74rem;color:#8A8378;margin:0 0 0.4rem;">Each link opens a live search at a store in your price range, so results stay current.</p>'+shopChips(r)+'</div></div>'});
  L.push({key:'fab',label:'Fabric Guide',html:'<h1 class="pdf-h1" style="margin-top:0;font-size:1.7rem;">Fabric, Avoid &amp; <em>Accessories</em></h1><div class="pdf-two"><div><p class="pdf-section-label" style="margin-top:0;">Best Fabrics</p><div class="pdf-box">'+esc(r.bodyGuide.fabGood)+'</div></div><div><p class="pdf-section-label" style="margin-top:0;">Fabrics To Avoid</p><div class="pdf-box">'+esc(r.bodyGuide.fabAvoid)+'</div></div></div>'
    +'<div class="pdf-two"><div><p class="pdf-section-label">Things To Minimize</p>'+pdfList(r.bodyGuide.avd)+'</div><div><p class="pdf-section-label">Accessory Styling Guide</p>'+pdfList(r.bodyGuide.acc)+'</div></div>'});
  return L;
}
let LAYOUT=null;
async function layoutPages(r){
  const blocks=makeBlocks(r);
  const host=document.createElement('div');host.className='pdf-page';host.style.cssText='position:absolute;left:-10000px;top:0;height:auto;overflow:visible;';
  host.innerHTML=blocks.map(b=>'<div class="pdf-blk">'+b.html+'</div>').join('');document.body.appendChild(host);
  try{
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    await Promise.all([...host.querySelectorAll('img')].map(i=>i.decode?i.decode().catch(()=>{}):Promise.resolve()));
    const kids=[...host.children];blocks.forEach((b,i)=>{b.h=kids[i].offsetHeight;});
  }finally{host.remove();}
  /* in-order packing: keep the reading order, start a new page only when the next section no longer fits */
  const pages=[];let cur=[],used=0;
  blocks.forEach(b=>{const need=cur.length?b.h+BLK_GAP:b.h;if(cur.length&&used+need>PAGE_CAP){pages.push(cur);cur=[b];used=b.h;}else{cur.push(b);used+=need;}});
  if(cur.length)pages.push(cur);
  window.__BLOCK_H=blocks.map(b=>b.key+':'+b.h).join(' ');
  LAYOUT=pages.map(pg=>pg.map(b=>b.key));
}
function buildPages(r){
  const label='Signature Style Report';
  const today=new Date();const date=today.toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
  const until=new Date(today.getTime()+45*86400000).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
  const blocks=makeBlocks(r),byKey={};blocks.forEach(b=>{byKey[b.key]=b;});
  const pages=[];
  pages.push(pdfPage('pdf-cover','<div class="pdf-logo">HerStyleVault</div><div class="pdf-pkg-pill">Signature Style Report</div><div class="pdf-client-name">'+esc(r.clientName)+'</div><div class="pdf-date">Prepared '+esc(date)+'</div>'));
  (LAYOUT||blocks.map(b=>[b.key])).forEach(keys=>{
    const bs=keys.map(k=>byKey[k]);
    pages.push(pdfPage('',bs.map((b,i)=>'<div class="'+(i?'pdf-blk-n':'')+'">'+b.html+'</div>').join('')+pdfFoot(label+' · '+bs.map(b=>b.label).join(' & '))));
  });
  pages.push(pdfPage('pdf-closing','<div class="pdf-logo">HerStyleVault</div><p style="font-family:\'Cormorant Garamond\',serif;font-style:italic;font-size:1.35rem;color:var(--accent);max-width:560px;margin:1.2rem 0 0.4rem;line-height:1.6;">This is your starting point. Take it shopping, take it to your closet, and come back when you want it turned into real outfits.</p>'
    +'<div class="pdf-credit"><strong>Your $40 credit</strong>Your Signature Style Report fee is credited toward any 1:1 package when you book within 45 days (by '+esc(until)+'). One use, on your first package. Mention your report on your free consultation and it comes off your deposit invoice. It cannot be combined with other offers.</div>'
    +'<p style="font-size:0.9rem;color:#3F3C38;">Book your free consultation at<br><strong data-href="https://herstylevault.com/book.html">herstylevault.com/book.html</strong></p><p style="font-size:0.9rem;color:#3F3C38;margin-top:1rem;">With love, <strong>Adebisi</strong><br>HerStyleVault</p>'));
  return pages;
}
let REPORT=null;
function fitPreviews(){
  const w=Math.min(document.getElementById('wrap').clientWidth,816);const s=w/816;
  document.querySelectorAll('.prev-slot').forEach(el=>{el.style.width=(816*s)+'px';el.style.height=(1056*s)+'px';el.firstElementChild.style.transform='scale('+s+')';});
}
async function renderReport(r){
  REPORT=r;await prepCroq(r);await layoutPages(r);
  const pages=buildPages(r);
  document.getElementById('app').innerHTML='<p class="hint">Your report is ready. Scroll through it here, or download the PDF to keep.</p>'+pages.map(p=>'<div class="prev-slot">'+p+'</div>').join('')
    +'<div class="cta"><h3>Ready to turn this into outfits?</h3><p>A free consultation turns this report into a real wardrobe. Your $40 is credited toward any 1:1 package if you book within 45 days.</p><a href="'+(r.isReturning?'book.html':'https://tally.so/r/yPeEjp')+'">'+(r.isReturning?'Book Your Session':'Fill Out Your Intake Form')+'</a></div>';
  fitPreviews();window.addEventListener('resize',fitPreviews);
  const btn=document.getElementById('dl-btn');btn.disabled=false;btn.onclick=()=>downloadPdf(btn);
}
async function downloadPdf(btn){
  const label=btn.textContent;btn.disabled=true;btn.textContent='Building PDF…';
  const root=document.getElementById('pdf-root');
  try{
    root.innerHTML=buildPages(REPORT).join('');
    await new Promise(r=>setTimeout(r,80));
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    const els=root.querySelectorAll('.pdf-page');const {jsPDF}=window.jspdf;
    const pdf=new jsPDF({unit:'px',format:[816,1056],compress:true});
    for(let i=0;i<els.length;i++){
      const canvas=await html2canvas(els[i],{scale:2,backgroundColor:'#ffffff',useCORS:true});
      if(i>0)pdf.addPage([816,1056],'portrait');
      pdf.addImage(canvas.toDataURL('image/jpeg',0.92),'JPEG',0,0,816,1056);
      const pr=els[i].getBoundingClientRect();
      els[i].querySelectorAll('[data-href]').forEach(el=>{const q=el.getBoundingClientRect();pdf.link(q.left-pr.left,q.top-pr.top,q.width,q.height,{url:el.getAttribute('data-href')});});
    }
    const safe=String(REPORT.clientName||'Client').replace(/[\\/:*?"<>|]/g,'').trim()||'Client';
    pdf.save(safe+' - Signature Style Report.pdf');
  }catch(e){console.error(e);alert('Something went wrong building the PDF. Please try again.');}
  finally{root.innerHTML='';btn.disabled=false;btn.textContent=label;}
}
async function init() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="loader">
      <div class="spinner"></div>
      <p>Generating your report...</p>
      <p class="sub">This takes about 20-30 seconds — we're building your personalized color and style analysis now.</p>
    </div>`;

  const sessionId = getSessionId();
  if (!sessionId) {
    showError('We couldn\'t confirm your payment', 'This page needs to be reached through the payment confirmation link. If you just paid, check your email for the receipt link, or reach out below.', false);
    return;
  }

  let data;
  try {
    data = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
  } catch (e) { data = null; }

  if (!data || !data.answers) {
    showError('We couldn\'t find your quiz answers', 'Your quiz answers are stored on the device and browser you took the quiz on. If you switched devices or cleared your browser data after paying, email us and we\'ll generate your report manually.', false);
    return;
  }

  try {
    const res = await fetch('/.netlify/functions/generate-report', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        sessionId,
        name: data.name,
        returningClient: data.returningClient,
        answers: data.answers,
        freeText: data.freeText,
        photoBase64: data.photoBase64,
        photoMediaType: data.photoMediaType
      })
    });

    if (!res.ok) {
      const errBody = await res.json().catch(() => ({}));
      if (res.status === 402) {
        showError('Payment not confirmed yet', 'Give it a moment and try again — if this keeps happening, email us and we\'ll take care of it.', true);
      } else {
        showError('Something went wrong generating your report', errBody.error || 'Please try again in a moment.', true);
      }
      return;
    }

    const report = await res.json();
    report.hadPhoto = !!data.photoBase64;
    renderReport(report);
  } catch (e) {
    showError('Something went wrong generating your report', 'Please try again in a moment.', true);
  }
}

init();
</script>
