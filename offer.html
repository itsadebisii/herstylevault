<header class="site"><nav><div class="nav-mount"></div></nav></header>

<script src="site.js"></script>
<script src="offers.js"></script>
<script>
(function(){
  var main = document.getElementById('offerMain');
  function card(o){
    return '<a class="pkg-card how-card" href="offer.html#' + o.slug + '"><div class="pkg-tag">' + o.tag.replace(/ \u00b7.*/,'') + '</div><h3 class="card-title" style="margin:0;font-size:22px;">' + o.name + '</h3><p style="font-size:14px;color:var(--ink-soft);margin:0;">' + o.short + '</p><div class="svc-from"><span>' + (o.kind==='package' ? '' : 'From ') + '</span>' + o.from + '</div><span class="how-overlay">Learn More \u2192</span></a>';
  }
  function render(){
    var slug = (location.hash || '').replace('#','');
    var o = OFFERS.filter(function(x){ return x.slug === slug; })[0] || OFFERS[0];
    document.title = o.name + ' | HerStyleVault';
    var isSvc = o.kind === 'service';
    var cta = isSvc
      ? '<a class="btn btn-primary book-btn" href="mailto:hello@herstylevault.com?subject=Book%20' + encodeURIComponent(o.name) + '" data-service="' + o.name + '" data-form="' + o.formKey + '">Book ' + o.name + '</a><p class="meta">Pay upfront \u00b7 No consultation needed</p>'
      : '<a class="btn btn-primary" href="' + o.cta.href + '">' + o.cta.label + '</a><p class="meta">' + o.ctaNote + '</p>';
    var h = '<section class="band wrap"><p class="crumb"><a href="' + (isSvc ? 'services.html' : 'packages.html') + '">' + (isSvc ? '\u00c0 La Carte Services' : 'Private Styling Packages') + '</a> / ' + o.name + '</p>' +
      '<div class="digital-hero"><div class="digital-cover"><span>' + o.tag + '</span><strong>' + o.name + '</strong><em>' + (window.hsvIcon ? hsvIcon('hanger', 22) : '') + '</em></div><div>' +
      '<p class="eyebrow">' + o.tag + '</p><h1 class="page-title" style="margin-bottom:1rem;">' + o.headline + '</h1>' +
      '<p class="sub" style="margin-bottom:1.2rem;">' + o.lead + '</p>' +
      '<div class="price" style="margin-bottom:0.3rem;">' + (isSvc ? '<span>From </span>' : '') + o.from + ' <span>' + (isSvc ? (o.slug==='the-ensemble' ? 'per person' : '') : o.fromNote) + '</span></div>' +
      '<p class="meta" style="margin:0 0 1.2rem;">' + o.meta + '</p>' + cta + '</div></div></section>';
    if (o.tiers) h += '<section class="band stone wrap" style="border-radius:4px;"><p class="eyebrow center">Choose Your Tier</p><h2 class="heading center">Pick what <em>fits</em></h2><div class="tier-row' + (o.tiers.length===2?' two':'') + '">' +
      o.tiers.map(function(t){ return '<div class="tier"><div class="tier-name">' + t[0] + '</div><div class="tier-price">' + t[1] + '<span>' + t[2] + '</span></div><div class="tier-desc">' + t[3] + '</div></div>'; }).join('') + '</div></section>';
    h += '<section class="band wrap"><p class="eyebrow center">What You Get</p><h2 class="heading center">What\u2019s <em>included</em></h2><ul class="includes-list">' + o.includes.map(function(i){ return '<li>' + i + '</li>'; }).join('') + '</ul></section>';
    h += '<section class="band stone wrap" style="border-radius:4px;"><p class="eyebrow center">How It Works</p><h2 class="heading center">Three <em>simple</em> steps</h2><div class="pkg-grid">' +
      o.steps.map(function(s,i){ return '<div class="pkg-card"><div class="pkg-tag">0' + (i+1) + '</div><h3 class="card-title" style="font-size:20px;">' + s[0] + '</h3><p style="font-size:14px;color:var(--ink-soft);margin:0;">' + s[1] + '</p></div>'; }).join('') + '</div></section>';
    h += '<section class="band wrap"><h2 class="heading center">Good to <em>know</em></h2><div class="acc-grid">' +
      o.faqs.map(function(f){ return '<div class="acc-item"><div class="acc-q" data-acc-toggle>' + f[0] + '<span class="acc-icon">+</span></div><div class="acc-a">' + f[1] + '</div></div>'; }).join('') + '</div></section>';
    var others = OFFERS.filter(function(x){ return x !== o && x.kind === o.kind; });
    h += '<section class="band stone wrap" style="border-radius:4px;"><p class="eyebrow center">More Ways to Work Together</p><h2 class="heading center">You may also <em>like</em></h2><div class="how-split" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr));">' + others.map(card).join('') + '</div><div class="cta-row"><a class="compare-link" href="' + (isSvc ? 'services.html' : 'packages.html') + '">See all ' + (isSvc ? '\u00e0 la carte services' : 'private styling packages') + ' \u2192</a></div></section>';
    main.innerHTML = h;
    if (window.initAccordions) initAccordions('.acc-item');
    if (window.applyBookButtons) applyBookButtons();
    window.scrollTo(0,0);
  }
  render();
  window.addEventListener('hashchange', render);
})();
</script>
<script src="https://tally.so/widgets/embed.js"></script>
</body>
