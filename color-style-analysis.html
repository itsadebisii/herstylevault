/* ----- Body shape (same rules as the stylist tools), used for the lead record ----- */
function computeBodyShape(a){
  const score={apple:0,pear:0,hourglass:0,rectangle:0,inverted:0};
  // Pear is only possible when the hips really are wider than the shoulders.
  const hipsWider=['hipsSlightlyWider','hipsMuchWider','hipsWiderShouldersFull'].indexOf(a.shoulderHip)>-1;
  if(a.shoulderHip==='shouldersMuchWider')score.inverted+=2;
  if(a.shoulderHip==='shouldersSlightlyWider')score.inverted+=2;
  if(a.shoulderHip==='hipsMuchWider')score.pear+=2;
  if(a.shoulderHip==='hipsSlightlyWider')score.pear+=2;
  if(a.shoulderHip==='hipsWiderShouldersFull')score.pear+=1;
  if(a.shoulderHip==='equal'){score.hourglass+=2;score.rectangle+=2;}
  if(a.waistDef==='veryDefined'){score.hourglass+=2;score.inverted+=1;if(hipsWider)score.pear+=1;}
  if(a.waistDef==='slightlyDefined'){score.inverted+=1;score.rectangle+=1;if(hipsWider)score.pear+=1;}
  if(a.waistDef==='barelyDefined')score.rectangle+=2;
  if(a.waistDef==='fullMidsection')score.apple+=3;
  if(a.bustHip==='bustMuchLarger'){score.apple+=1;score.inverted+=1;}
  if(a.bustHip==='bustSlightlyLarger'){score.apple+=1;score.inverted+=1;}
  if(a.bustHip==='hipsMuchLarger')score.pear+=2;
  if(a.bustHip==='hipsSlightlyLarger')score.pear+=2;
  if(a.bustHip==='roughlyEqual'){score.hourglass+=2;score.rectangle+=2;}
  if(a.bustHip==='fullBoth'){score.hourglass+=1;score.apple+=1;}
  if(!hipsWider)score.pear=-1;
  let best='hourglass',bestScore=-1;
  const order=['hourglass','pear','inverted','apple','rectangle'];
  order.forEach(k=>{if(score[k]>bestScore){bestScore=score[k];best=k;}});
  return best;
}

      <div class="opt ${(q.multi ? (A[q.key] || []).indexOf(o.value) > -1 : A[q.key] === o.value) ? 'sel' : ''}" data-key="${q.key}" data-val="${o.value}"${q.multi ? ' data-multi="1"' + (q.max ? ' data-max="' + q.max + '"' : '') + ' role="checkbox" aria-checked="' + ((A[q.key] || []).indexOf(o.value) > -1) + '"' : ''}>${iconHtml(o.icon)}<span>${o.label}</span></div>`).join('')}</div>`;
  }

  if (q.key === 'goal' && A.goal && A.goal !== 'none') body += '<input type="text" class="own-box" id="goalDate" maxlength="30" placeholder="When is it? For example: June 12" value="' + String(A.goalDate || '').replace(/"/g, '&quot;') + '">';
  if (OWN_PLACEHOLDER[q.key] && A[q.key] === 'other') body += '<input type="text" class="own-box" id="' + q.key + '-other" maxlength="90" placeholder="' + OWN_PLACEHOLDER[q.key] + '" value="' + String(A[q.key + 'Other'] || '').replace(/"/g, '&quot;') + '">';

  return `
    ${progressHtml()}
    <p class="meta">${q.noCount ? sectionLabel : sectionLabel + ' · ' + (q.followUp ? 'Question 4, continued' : (q.optional ? 'Optional ' + q.n + ' of ' + q.of : 'Question ' + q.n + ' of ' + q.of))}</p>
    <p class="qtext">${q.text || questionTextForType(q.type)}</p>
    ${q.hint ? `<p class="hint">${q.hint}</p>` : ''}
    ${whyHtml(q.key)}
    ${body}
    ${navHtml(true)}`;
}

function questionTextForType(type) {
  if (type === 'depth') return 'Tap the shade closest to your natural skin tone.';
  if (type === 'contrast') return 'How different are your natural hair, skin and eye colors from one another? Use your natural hair color, even if you dye it.';
  if (type === 'veins') return 'Look at the inside of your wrist in natural light. Do your veins look more blue or purple, or more green?';
  if (type === 'shape') return 'Which body shape best describes you?';
  return '';
}

function attachHandlers(f) {
  document.querySelectorAll('[data-key]').forEach(el => {
    el.addEventListener('click', () => {
      if (el.dataset.multi) {
        /* choose-all-that-apply: "evenly" is exclusive, anything else clears it */
        const cur = Array.isArray(A[el.dataset.key]) ? A[el.dataset.key].slice() : [];
        const v = el.dataset.val, at = cur.indexOf(v), max = Number(el.dataset.max) || 0;
        if (max && at === -1 && cur.length >= max) return;
        let next;
        if (at > -1) { cur.splice(at, 1); next = cur; }
        else if (v === 'evenly' || v === 'none') { next = [v]; }
        else { next = cur.filter(x => x !== 'evenly' && x !== 'none'); next.push(v); }
        A[el.dataset.key] = next;
      } else {
        A[el.dataset.key] = el.dataset.val;
      }
      render();
    });
  });
  ['pq1', 'pq2', 'pq3'].forEach(k => { const el = document.getElementById(k + '-other'); if (el) el.addEventListener('input', (e) => { A[k + 'Other'] = e.target.value; }); });
  const gd = document.getElementById('goalDate'); if (gd) gd.addEventListener('input', (e) => { A.goalDate = e.target.value; });
  const inspoF = document.getElementById('inspo-field'); if (inspoF) inspoF.addEventListener('input', (e) => { A.inspo = e.target.value; });
  [['sizeTop'], ['sizeBottom'], ['sizeShoe']].forEach(([id]) => { const el = document.getElementById(id); if (el) el.addEventListener('change', (e) => { A[id] = e.target.value; const nb = document.getElementById('next-btn'); if (nb) nb.textContent = (A.sizeTop || A.sizeBottom || A.sizeShoe) ? 'Next' : 'Skip'; }); });
  const skipLife = document.getElementById('skip-life-btn'); if (skipLife) skipLife.addEventListener('click', () => { step = FLOW.findIndex(f => f.type === 'freetext'); render(); });
  const compOther = document.getElementById('comp-other');
  if (compOther) compOther.addEventListener('input', (e) => { A.compOther = e.target.value; const nb = document.getElementById('next-btn'); if (nb) nb.disabled = !canAdvance(); });
  const backBtn = document.getElementById('back-btn');
  if (backBtn) backBtn.addEventListener('click', () => { if (step > 0) { step--; while (step > 0 && FLOW[step].type === 'question' && FLOW[step].q.showIf && !FLOW[step].q.showIf(A)) step--; render(); } });
  const nextBtn = document.getElementById('next-btn');
  if (nextBtn) nextBtn.addEventListener('click', onNext);
  attachCarousel();
  const beginBtn = document.getElementById('begin-btn');
  if (beginBtn) beginBtn.addEventListener('click', () => {
    const nf = document.getElementById('name-field'), ef = document.getElementById('email-field');
    name = (nf && nf.value.trim()) || '';
    email = (ef && ef.value.trim()) || '';
    if (!name || !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email) || !planToBook) { const er = document.getElementById('start-err'); if (er) er.style.display = 'block'; return; }
    sendLead('started');
    step++; render();
  });
  const nextCoverBtn = document.getElementById('next-cover-btn');
  if (nextCoverBtn) nextCoverBtn.addEventListener('click', () => { step++; render(); });

  const nameField = document.getElementById('name-field');
  if (nameField) nameField.addEventListener('input', (e) => { name = e.target.value; });
  const emailField = document.getElementById('email-field');
  if (emailField) emailField.addEventListener('input', (e) => { email = e.target.value; });
  const mktBox = document.getElementById('mkt-box');
  if (mktBox) mktBox.addEventListener('change', (e) => { marketing = e.target.checked ? 'yes' : ''; });
  const planYes = document.getElementById('plan-yes-btn');
  if (planYes) planYes.addEventListener('click', () => { planToBook = 'yes'; render(); });
  const planNo = document.getElementById('plan-no-btn');
  if (planNo) planNo.addEventListener('click', () => { planToBook = 'no'; render(); });

  const freetextField = document.getElementById('freetext-field');
  if (freetextField) freetextField.addEventListener('input', (e) => { freeText = e.target.value; });

  const previewSkip = document.getElementById('preview-skip');
  if (previewSkip) previewSkip.addEventListener('click', () => { saveForReport(); window.location.href = 'analysis-results.html?session_id=preview-test&preview=1'; });
  const photoField = document.getElementById('photo-field');
  if (photoField) photoField.addEventListener('change', handlePhoto);
}

function handlePhoto(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const maxDim = 700;
      let w = img.width, h = img.height;
      if (w > h && w > maxDim) { h = Math.round(h * maxDim / w); w = maxDim; }
      else if (h > maxDim) { w = Math.round(w * maxDim / h); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.72);
      photoBase64 = dataUrl.split(',')[1];
      photoMediaType = 'image/jpeg';
      render();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function onNext() {
  const isLast = step === FLOW.length - 1;
  if (isLast) {
    submitAndPay();
    return;
  }
  step++;
  while (step < FLOW.length - 1 && FLOW[step].type === 'question' && FLOW[step].q.showIf && !FLOW[step].q.showIf(A)) step++;
  render();
}

// What we keep depends on the "might you book?" answer.
// No  -> name and email only (plus the choice itself). Answers and results are not sent to the sheet.
// Yes -> also the answers and results, so we can offer to reuse them at the consultation or first session. The photo is never sent.
function leadPayload(stage, p) {
  const base = { stage: stage || 'payment', name, email, planToBook: planToBook || '', marketingOptIn: marketing === 'yes' ? 'yes' : 'no', keepResults: planToBook === 'yes' ? 'yes' : 'no', createdAt: new Date().toISOString() };
  if (planToBook !== 'yes') return base;
  return Object.assign(base, {
    ageBracket: A.ageBracket || '', budget: A.budget || '', primaryVibe: p.vibe, persona: p.name,
    depth: A.depth || '', jewelry: A.jewelry || '', veins: A.veins || '',
    shape: (A.shoulderHip && A.waistDef && A.bustHip) ? computeBodyShape(A) : '',
    answers: JSON.stringify(finalAnswers()), notes: freeText || ''
  });
}

function sendLead(stage) {
  // Fire-and-forget: never awaited, never throws, and skipped entirely when no webhook URL is set.
  try {
    if (!GOOGLE_SHEET_WEBHOOK_URL) return;
    let p = { vibe: '', name: '' };
    try { if (A.ageBracket && A.pq1 && A.pq2 && A.pq3) p = computePersona(A); } catch (e) {}
    fetch(GOOGLE_SHEET_WEBHOOK_URL, {
      method: 'POST', mode: 'no-cors', keepalive: true,
      body: JSON.stringify(leadPayload(stage, p))
    }).catch(function () {});
  } catch (e) {}
}

const IS_PREVIEW = /--herstylevault\.netlify\.app$/.test(location.hostname) || location.hostname === 'localhost';
function saveForReport() {
  const data = { name, email, planToBook, answers: finalAnswers(), freeText, photoBase64, photoMediaType, createdAt: Date.now() };
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) {
    // Photo too large for localStorage — drop it and retry without it.
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...data, photoBase64: null, photoMediaType: null }));
    } catch (e2) {}
  }
}
function submitAndPay() {
  saveForReport();
  sendLead('payment');
  // Stripe fills in the email they already typed here (they can still change it). The report is emailed to the address on the Stripe checkout.
  window.location.href = STRIPE_LINK + (email ? (STRIPE_LINK.indexOf('?') > -1 ? '&' : '?') + 'prefilled_email=' + encodeURIComponent(email) : '');
}

render();
</script>
