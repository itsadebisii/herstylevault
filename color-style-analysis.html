<style>
:root{--bg:#FAF9F6;--surface:#EFECE6;--ink:#181716;--ink-soft:#6B6862;--line:#DCD8D0;--accent:#7A1321;--accent-deep:#4E0B14;--accent-ink:#FAF9F6;
  --font-display:'Cormorant Garamond',Georgia,'Times New Roman',serif;--font-body:'Plus Jakarta Sans',-apple-system,'Segoe UI',sans-serif;}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:var(--font-body);background:var(--surface);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.4rem;line-height:1.6;-webkit-font-smoothing:antialiased;}
.shell{width:100%;max-width:640px;background:var(--bg);border:1px solid var(--line);border-radius:2px;min-height:560px;display:flex;flex-direction:column;}
.pad{padding:clamp(1.6rem,5vw,2.6rem);flex:1;display:flex;flex-direction:column;}
.progress{display:flex;gap:3px;margin-bottom:1.6rem;}
.progress span{height:2px;flex:1;background:var(--line);}
.progress span.done{background:var(--accent);}
.meta{font-size:0.66rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:0.8rem;font-weight:500;}
.qtext{font-family:var(--font-display);font-size:1.7rem;font-weight:500;color:var(--ink);margin-bottom:0.9rem;line-height:1.2;}
.hint{font-size:0.8rem;color:var(--ink-soft);margin-bottom:1.2rem;}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:0.7rem;margin-top:auto;margin-bottom:1.6rem;}
.opt{border:1px solid var(--line);background:var(--bg);padding:0.9rem 1rem;font-size:0.85rem;color:var(--ink);text-align:left;cursor:pointer;font-family:var(--font-body);border-radius:6px;display:flex;align-items:center;gap:0.8rem;}
.opt:hover{border-color:var(--ink-soft);}
.opt.sel{border:1px solid var(--accent);background:var(--surface);color:var(--ink);font-weight:500;}
.opt-ic{flex:0 0 46px;width:46px;height:46px;display:flex;align-items:center;justify-content:center;}
.opt-ic svg{width:100%;height:100%;}
.foil{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);}
.foil.gold{background:linear-gradient(135deg,#f4e3a8 0%,#c9a24a 38%,#8a6a22 52%,#e9d28a 78%,#b5892f 100%);}
.foil.silver{background:linear-gradient(135deg,#f6f6f6 0%,#b9bcc1 38%,#7d8187 52%,#e3e5e8 78%,#a2a6ab 100%);}
.foil.both{background:linear-gradient(135deg,#f4e3a8 0%,#c9a24a 45%,#b9bcc1 55%,#f6f6f6 100%);}
.tone-opts{display:grid;grid-template-columns:repeat(4,1fr);gap:0.7rem;margin-bottom:1.6rem;margin-top:auto;}
.tone-opt{border:1px solid var(--line);background:var(--bg);padding:0.7rem;text-align:center;cursor:pointer;border-radius:6px;}
.tone-opt.sel{border-color:var(--accent);background:var(--surface);}
.tone-swatch{width:100%;aspect-ratio:1;border-radius:50% 50% 3px 3px;margin:0 auto 0.6rem;border:1px solid var(--line);}
.tone-opt .lbl{font-size:0.76rem;color:var(--ink-soft);}
.tone-opt.sel .lbl{color:var(--ink);font-weight:500;}
.group-lbl{font-size:0.66rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:0.5rem;margin-top:0.9rem;font-weight:500;}
.group-lbl:first-of-type{margin-top:0;}
.tri-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:0.6rem;}
.tri-opt{border:1px solid var(--line);background:var(--bg);padding:0.7rem 0.5rem;text-align:center;cursor:pointer;border-radius:6px;}
.tri-opt.sel{border-color:var(--accent);background:var(--surface);}
.tri-opt .demo{display:flex;justify-content:center;align-items:stretch;gap:2px;margin-bottom:0.5rem;height:34px;}
.tri-opt .demo div{width:18px;height:34px;border-radius:1px;}
.tri-opt .lbl{font-size:0.7rem;color:var(--ink-soft);line-height:1.3;}
.tri-opt.sel .lbl{color:var(--ink);font-weight:500;}
.tri-opt svg{width:46px;height:46px;margin-bottom:0.4rem;}
.notsure-wrap{max-width:33%;margin-top:0.9rem;}
.shape-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:0.6rem;margin-bottom:1.6rem;margin-top:auto;}
textarea.freetext{width:100%;min-height:120px;border:1px solid var(--line);background:var(--bg);padding:0.9rem 1rem;font-family:var(--font-body);font-size:0.88rem;color:var(--ink);margin-top:auto;margin-bottom:1.6rem;resize:vertical;border-radius:2px;}
textarea.freetext:focus,input.nameinput:focus{outline:1px solid var(--accent);}
input.nameinput{width:100%;border:1px solid var(--line);background:var(--bg);padding:0.9rem 1rem;font-family:var(--font-body);font-size:0.92rem;color:var(--ink);margin-bottom:0.8rem;border-radius:2px;}
.field-err{font-size:0.78rem;color:var(--accent);margin:-0.2rem 0 0.8rem;}
.upload-box{border:1px dashed var(--ink-soft);background:var(--bg);padding:1.6rem 1rem;text-align:center;font-size:0.8rem;color:var(--ink-soft);margin-top:auto;margin-bottom:1.6rem;cursor:pointer;border-radius:6px;}
.upload-box strong{display:block;color:var(--accent);font-size:0.72rem;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:0.4rem;}
.upload-box img{max-width:120px;max-height:120px;margin-top:0.8rem;border-radius:2px;}
.upload-box input[type=file]{display:none;}
.nav{display:flex;justify-content:space-between;align-items:center;}
.back-link{font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-soft);cursor:pointer;background:none;border:none;font-family:var(--font-body);}
.back-link:disabled{opacity:0;pointer-events:none;}
.next-btn,.cover-btn{font-family:var(--font-body);font-size:0.72rem;letter-spacing:0.14em;text-transform:uppercase;background:var(--ink);color:var(--accent-ink);padding:0.85rem 1.9rem;border:none;cursor:pointer;border-radius:6px;font-weight:500;}
.next-btn:hover,.cover-btn:hover{background:var(--accent-deep);}
.next-btn:disabled,.cover-btn:disabled{opacity:0.4;cursor:not-allowed;}
.cover{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:left;}
.cover-eyebrow{font-size:0.68rem;letter-spacing:0.22em;text-transform:uppercase;color:var(--accent);margin-bottom:0.9rem;font-weight:500;}
.cover-title{font-family:var(--font-display);font-weight:500;font-size:clamp(2rem,6.5vw,2.8rem);line-height:1.05;margin-bottom:0.9rem;color:var(--ink);}
.cover-title em{font-style:italic;color:var(--accent);}
.returning-toggle{display:flex;gap:0.5rem;margin:0.9rem 0 0.9rem;}
.returning-opt{flex:1;font-family:var(--font-body);font-size:0.76rem;border:1px solid var(--line);background:var(--bg);color:var(--ink-soft);padding:0.65rem 0.5rem;cursor:pointer;border-radius:6px;}
.plan-q{font-family:var(--font-body);font-size:0.84rem;color:var(--ink);margin:1rem 0 0.4rem;font-weight:500;line-height:1.45;}
.plan-note{font-size:12px;opacity:.75;margin:0.5rem 0 0.9rem;line-height:1.55;}
.returning-opt.sel{border-color:var(--accent);background:var(--surface);color:var(--ink);font-weight:500;}
.cover-sub{font-size:0.9rem;line-height:1.75;color:var(--ink-soft);margin-bottom:1.6rem;max-width:46ch;}
.cover-btn{align-self:flex-start;}
.error-box{border:1px solid var(--accent);background:var(--surface);color:var(--accent-deep);padding:1rem 1.2rem;font-size:0.84rem;margin-top:auto;border-radius:2px;}
.loader{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:1.2rem;text-align:center;}
.spinner{width:34px;height:34px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin 0.9s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
@media (max-width:480px){.opts{grid-template-columns:1fr;}.tone-opts{grid-template-columns:repeat(2,1fr);}.tri-opts,.shape-opts{grid-template-columns:repeat(2,1fr);}.notsure-wrap{max-width:100%;}}

.vc{text-align:center;margin-bottom:1.6rem;}
.vc-group{display:flex;gap:0.5rem;justify-content:center;margin:0 0 0.9rem;}
.vc-gbtn{font-family:var(--font-body);font-size:0.72rem;letter-spacing:0.06em;background:transparent;border:1px solid var(--line);color:var(--ink-soft);padding:0.45rem 0.85rem;border-radius:2px;cursor:pointer;}
.vc-gbtn.on{border-color:var(--accent);color:var(--ink);background:var(--surface);font-weight:500;}
.vc-frame{position:relative;}
.vc-art{width:100%;height:300px;display:flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--line);border-radius:4px;cursor:pointer;overflow:hidden;padding:1rem 3.1rem;user-select:none;-webkit-tap-highlight-color:transparent;}
.vc-art:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.vc-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(250,249,246,0.95);color:var(--ink);font-size:1.05rem;cursor:pointer;}.vc-arrow[data-dir="-1"]{left:8px;}.vc-arrow[data-dir="1"]{right:8px;}
.vc-arrow:hover{border-color:var(--ink);}
.vc-count{font-size:0.7rem;letter-spacing:0.14em;color:var(--ink-soft);margin:0.7rem 0 0.4rem;}
.vc-desc{font-family:var(--font-display);font-size:1.3rem;line-height:1.25;color:var(--ink);margin:0 0 0.9rem;min-height:3.3rem;display:flex;align-items:center;justify-content:center;}
.vc-pick{font-family:var(--font-body);font-size:0.74rem;letter-spacing:0.12em;text-transform:uppercase;background:var(--bg);color:var(--ink);border:1px solid var(--ink);border-radius:2px;padding:0.8rem 1.8rem;cursor:pointer;min-width:200px;}
.vc-pick.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
.vc-notsure{display:block;margin:0.7rem auto 0;font-family:var(--font-body);font-size:0.72rem;letter-spacing:0.06em;background:transparent;border:1px solid var(--line);color:var(--ink-soft);padding:0.55rem 1.2rem;border-radius:2px;cursor:pointer;}
.vc-notsure.on{border-color:var(--accent);color:var(--ink);background:var(--surface);font-weight:500;}
.vc-sw{display:flex;gap:0.45rem;align-items:flex-end;justify-content:center;}
.vc-arch{display:block;width:46px;height:56px;border-radius:23px 23px 4px 4px;border:3px solid #CDBBA8;background-clip:padding-box;}
.vc-arch-xl{width:110px;height:132px;border-radius:55px 55px 6px 6px;}
.vc-sw-demo .vc-arch{width:62px;height:84px;border-radius:31px 31px 5px 5px;}
.vc-arch-q{display:flex;align-items:center;justify-content:center;background:transparent!important;border:2px dashed #CDBBA8;font-family:var(--font-display);font-size:2rem;color:var(--ink-soft);}
.vc-foils{display:flex;align-items:center;justify-content:center;}
.vc-foil{display:block;width:118px;height:118px;border-radius:50%;border:1px solid var(--line);box-shadow:inset 0 0 0 8px rgba(255,255,255,0.18);}
.vc-foil.gold{background:linear-gradient(135deg,#f4e3a8 0%,#c9a24a 38%,#8a6a22 52%,#e9d28a 78%,#b5892f 100%);}
.vc-foil.silver{background:linear-gradient(135deg,#f6f6f6 0%,#b9bcc1 38%,#7d8187 52%,#e3e5e8 78%,#a2a6ab 100%);}
.vc-foil-q{display:flex;align-items:center;justify-content:center;border:2px dashed #CDBBA8;background:transparent;font-family:var(--font-display);font-size:2.6rem;color:var(--ink-soft);box-shadow:none;}
.vc-icons{display:flex;gap:0.8rem;align-items:center;justify-content:center;width:100%;height:100%;}
.vc-ic{flex:1;max-width:190px;height:100%;max-height:250px;display:flex;align-items:center;justify-content:center;}
.vc-ic svg{width:100%;height:100%;}
.vc-icons .vc-ic:only-child{max-width:210px;}
.vc-croq{height:100%;display:flex;align-items:center;justify-content:center;}
.vc-croq svg{height:100%;width:auto;max-width:100%;}
.vc-vein{width:190px;height:190px;}
.vc-vein svg{width:100%;height:100%;}
@media (max-width:420px){.vc-art{height:270px;padding:0.7rem 2.8rem;}.vc-arrow{width:34px;height:34px;}}
</style>
</head>

// Persona answers read differently by age bracket. The saved value (left) never changes, so scoring is identical for every age.

  { section: 'body', n: 3, of: 10, key: 'styleGrav', text: 'Are there styles you always gravitate toward?', options: [opt('Flowy and loose','flowy'), opt('Fitted and structured','fitted'), opt('Anything that defines the waist','waist'), opt('Oversized and relaxed','oversized')] },

/* ----- Body shape (same rules as the stylist tools), used for the lead record ----- */
function computeBodyShape(a){
  const score={apple:0,pear:0,hourglass:0,rectangle:0,inverted:0};
  // Pear is only possible when the hips really are wider than the shoulders.
  const hipsWider=['hipsSlightlyWider','hipsMuchWider','hipsWiderShouldersFull'].indexOf(a.shoulderHip)>-1;
  if(a.shoulderHip==='shouldersMuchWider')score.inverted+=2;
  if(a.shoulderHip==='shouldersSlightlyWider')score.inverted+=2;
  if(a.shoulderHip==='hipsMuchWider')score.pear+=2;
  if(a.shoulderHip==='hipsSlightlyWider')score.pear+=2;
  if(a.shoulderHip==='hipsWiderShouldersFull')score.pear+=1;
  if(a.shoulderHip==='equal'){score.hourglass+=2;score.rectangle+=2;}
  if(a.waistDef==='veryDefined'){score.hourglass+=2;score.inverted+=1;if(hipsWider)score.pear+=1;}
  if(a.waistDef==='slightlyDefined'){score.inverted+=1;score.rectangle+=1;if(hipsWider)score.pear+=1;}
  if(a.waistDef==='barelyDefined')score.rectangle+=2;
  if(a.waistDef==='fullMidsection')score.apple+=3;
  if(a.bustHip==='bustMuchLarger'){score.apple+=1;score.inverted+=1;}
  if(a.bustHip==='bustSlightlyLarger'){score.apple+=1;score.inverted+=1;}
  if(a.bustHip==='hipsMuchLarger')score.pear+=2;
  if(a.bustHip==='hipsSlightlyLarger')score.pear+=2;
  if(a.bustHip==='roughlyEqual'){score.hourglass+=2;score.rectangle+=2;}
  if(a.bustHip==='fullBoth'){score.hourglass+=1;score.apple+=1;}
  if(!hipsWider)score.pear=-1;
  let best='hourglass',bestScore=-1;
  const order=['hourglass','pear','inverted','apple','rectangle'];
  order.forEach(k=>{if(score[k]>bestScore){bestScore=score[k];best=k;}});
  return best;
}

function computePersona(a){
  a = a || {};

      </div>`;
  } else if (q.type === 'shape') {
    body = `<div class="shape-opts">${Object.keys(SHAPE_SVGS).map(k => `
      <div class="shape-opt ${A.shape === k ? 'sel' : ''}" data-key="shape" data-val="${k}">
        ${shapeSvg(k)}
        <span class="lbl">${SHAPE_LABELS[k]}</span>
        <span class="desc">${SHAPE_SVGS[k].desc}</span>
      </div>`).join('')}</div>`;
  } else {
    const qOpts = q.dynamic ? personaOptions(q.key) : q.options;
    body = `<div class="opts"${q.section === 'persona' ? ' style="grid-template-columns:1fr;"' : ''}>${qOpts.map(o => `
      <div class="opt ${(q.multi ? (A[q.key] || []).indexOf(o.value) > -1 : A[q.key] === o.value) ? 'sel' : ''}" data-key="${q.key}" data-val="${o.value}"${q.multi ? ' data-multi="1" role="checkbox" aria-checked="' + ((A[q.key] || []).indexOf(o.value) > -1) + '"' : ''}>${iconHtml(o.icon)}<span>${o.label}</span></div>`).join('')}</div>`;
  }

  return `
    ${progressHtml()}
    <p class="meta">${sectionLabel} · Question ${q.n} of ${q.of}</p>
    <p class="qtext">${q.text || questionTextForType(q.type)}</p>
    ${body}
    ${navHtml(true)}`;
}

function questionTextForType(type) {
  if (type === 'depth') return 'How would you describe your own skin tone depth?';
  if (type === 'contrast') return 'How much contrast is there between your hair, skin, and eyes?';
  if (type === 'veins') return 'Look at your wrist — are your veins more blue/purple or green?';
  if (type === 'shape') return 'Which body shape best describes you?';
  return '';
}

function attachHandlers(f) {
  document.querySelectorAll('[data-key]').forEach(el => {
    el.addEventListener('click', () => {
      if (el.dataset.multi) {
        /* choose-all-that-apply: "evenly" is exclusive, anything else clears it */
        const cur = Array.isArray(A[el.dataset.key]) ? A[el.dataset.key].slice() : [];
        const v = el.dataset.val, at = cur.indexOf(v);
        let next;
        if (at > -1) { cur.splice(at, 1); next = cur; }
        else if (v === 'evenly') { next = ['evenly']; }
        else { next = cur.filter(x => x !== 'evenly'); next.push(v); }
        A[el.dataset.key] = next;
      } else {
        A[el.dataset.key] = el.dataset.val;
      }
      render();
    });
  });
  const backBtn = document.getElementById('back-btn');
  if (backBtn) backBtn.addEventListener('click', () => { if (step > 0) { step--; render(); } });
  const nextBtn = document.getElementById('next-btn');
  if (nextBtn) nextBtn.addEventListener('click', onNext);
  attachCarousel();
  const beginBtn = document.getElementById('begin-btn');
  if (beginBtn) beginBtn.addEventListener('click', () => {
    const nf = document.getElementById('name-field'), ef = document.getElementById('email-field');
    name = (nf && nf.value.trim()) || '';
    email = (ef && ef.value.trim()) || '';
    if (!name || !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email) || !planToBook) { const er = document.getElementById('start-err'); if (er) er.style.display = 'block'; return; }
    sendLead('started');
    step++; render();
  });
  const nextCoverBtn = document.getElementById('next-cover-btn');
  if (nextCoverBtn) nextCoverBtn.addEventListener('click', () => { step++; render(); });

  const nameField = document.getElementById('name-field');
  if (nameField) nameField.addEventListener('input', (e) => { name = e.target.value; });
  const emailField = document.getElementById('email-field');
  if (emailField) emailField.addEventListener('input', (e) => { email = e.target.value; });
  const firstTimeBtn = document.getElementById('first-time-btn');
  if (firstTimeBtn) firstTimeBtn.addEventListener('click', () => { returningClient = false; render(); });
  const planYes = document.getElementById('plan-yes-btn');
  if (planYes) planYes.addEventListener('click', () => { planToBook = 'yes'; render(); });
  const planNo = document.getElementById('plan-no-btn');
  if (planNo) planNo.addEventListener('click', () => { planToBook = 'no'; render(); });
  const returningBtn = document.getElementById('returning-btn');
  if (returningBtn) returningBtn.addEventListener('click', () => { returningClient = true; render(); });

  const freetextField = document.getElementById('freetext-field');
  if (freetextField) freetextField.addEventListener('input', (e) => { freeText = e.target.value; });

  const photoField = document.getElementById('photo-field');
  if (photoField) photoField.addEventListener('change', handlePhoto);
}

function handlePhoto(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const maxDim = 700;
      let w = img.width, h = img.height;
      if (w > h && w > maxDim) { h = Math.round(h * maxDim / w); w = maxDim; }
      else if (h > maxDim) { w = Math.round(w * maxDim / h); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.72);
      photoBase64 = dataUrl.split(',')[1];
      photoMediaType = 'image/jpeg';
      render();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function onNext() {
  const isLast = step === FLOW.length - 1;
  if (isLast) {
    submitAndPay();
    return;
  }
  step++;
  render();
}

// What we keep depends on the "might you book?" answer.
// No  -> name and email only (plus the choice itself). Answers and results are not sent to the sheet.
// Yes -> also the answers and results, so we can offer to reuse them at the consultation or first session. The photo is never sent.
function leadPayload(stage, p) {
  const base = { stage: stage || 'payment', name, email, planToBook: planToBook || '', keepResults: planToBook === 'yes' ? 'yes' : 'no', createdAt: new Date().toISOString() };
  if (planToBook !== 'yes') return base;
  return Object.assign(base, {
    ageBracket: A.ageBracket || '', budget: A.budget || '', primaryVibe: p.vibe, persona: p.name,
    depth: A.depth || '', jewelry: A.jewelry || '', veins: A.veins || '',
    shape: (A.shoulderHip && A.waistDef && A.bustHip) ? computeBodyShape(A) : '',
    answers: JSON.stringify(A), notes: freeText || ''
  });
}

function sendLead(stage) {
  // Fire-and-forget: never awaited, never throws, and skipped entirely when no webhook URL is set.
  try {
    if (!GOOGLE_SHEET_WEBHOOK_URL) return;
    let p = { vibe: '', name: '' };
    try { if (A.ageBracket && A.pq1 && A.pq2 && A.pq3) p = computePersona(A); } catch (e) {}
    fetch(GOOGLE_SHEET_WEBHOOK_URL, {
      method: 'POST', mode: 'no-cors', keepalive: true,
      body: JSON.stringify(leadPayload(stage, p))
    }).catch(function () {});
  } catch (e) {}
}

function submitAndPay() {
  const data = { name, email, returningClient, planToBook, answers: A, freeText, photoBase64, photoMediaType, createdAt: Date.now() };
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) {
    // Photo too large for localStorage — drop it and retry without it.
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...data, photoBase64: null, photoMediaType: null }));
    } catch (e2) {}
  }
  sendLead('payment');
  window.location.href = STRIPE_LINK;
}

render();
</script>
