[build]
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/assets/**"]

[[redirects]]
  from = "/add-ons.html"
  to = "/services.html"
  status = 301

[[redirects]]
  from = "/vault-exclusives.html"
  to = "/packages.html"
  status = 301

# Lookbook is hidden until the new one is ready (temporary redirect, easy to remove)
[[redirects]]
  from = "/lookbook.html"
  to = "/"
  status = 302
  force = true
[[redirects]]
  from = "/lookbook"
  to = "/"
  status = 302
  force = true
