<body>
<header class="site"><nav><div class="nav-mount"></div></nav></header>

<section class="band wrap" style="max-width:720px;">
<p class="eyebrow center" id="gdEyebrow">One moment</p>
<h1 class="page-title center" id="gdTitle">Checking your purchase…</h1>
<div id="gdBody" class="center" style="margin-top:1.4rem;"><p class="sub center" style="margin:0 auto;">This only takes a second.</p></div>
</section>

<footer class="site"><div class="footer-mount"></div></footer>
<script src="site.js?v=2b3ce40c"></script>
<script>
(function(){
  var sid = new URLSearchParams(location.search).get('session_id') || '';
  var eb = document.getElementById('gdEyebrow'), tt = document.getElementById('gdTitle'), bd = document.getElementById('gdBody');
  var base = '/.netlify/functions/get-guide?session_id=' + encodeURIComponent(sid);
  function problem(msg){
    eb.textContent = 'Something went wrong';
    tt.innerHTML = 'We couldn’t find your <em>purchase</em>';
    bd.innerHTML = '<p class="sub center" style="margin:0 auto 1.2rem;">' + msg + '</p><div class="cta-row"><a class="btn btn-primary" href="contact.html?topic=Digital%20products&note=My%20Wardrobe%20Detox%20Guide%20download%20is%20not%20working.">Contact Us and We’ll Fix It</a></div>';
  }
  if (!sid) { problem('This page needs the link you were sent right after checkout. If you paid and lost it, email me and I’ll send your guide.'); return; }
  fetch(base + '&check=1').then(function(r){ return r.json().then(function(j){ return { s: r.status, j: j }; }); }).then(function(res){
    if (res.j && res.j.ok) {
      eb.textContent = 'Thank you';
      tt.innerHTML = 'Your guide is <em>ready</em>';
      bd.innerHTML =
        '<p class="sub center" style="margin:0 auto 1.6rem;">Your payment went through. Tap the button to download The Wardrobe Detox Guide as a PDF.</p>' +
        '<div class="cta-row"><a class="btn btn-primary" href="' + base + '">Download Your Guide (PDF)</a></div>' +
        '<p class="sub center" style="margin:1rem auto 0;font-size:13px;">It saves as a PDF file. On iPhone, tap the download arrow at the top of Safari, or open the <b>Files</b> app and look in <b>Downloads</b>. On a computer, check your Downloads folder.</p>' + base + '" target="_blank" rel="noopener">Open in a new tab</a></p>' +
        '<ul class="dg-list" style="text-align:left;max-width:460px;margin:2rem auto 0;">' +
        '<li>Save it to your phone or computer so you always have it. You can also print it.</li>' +
        '<li>Keep this page’s link. You can come back and download it again anytime.</li>' +
        '<li>Your receipt is on its way from Stripe. Questions? <a href="contact.html">Contact us</a>.</li></ul>' +
        '<p class="sub center" style="margin:2.2rem auto 0;font-size:14px;">Want hands-on help next? <a href="book.html">Book a free consultation</a> or <a href="shop.html">see everything I offer</a>.</p>';
    } else if (res.s === 402) {
      problem('Your payment hasn’t finished processing yet. Wait a moment, then refresh this page.');
    } else {
      problem('If you just paid, wait a moment and refresh. If it still doesn’t work, email me and I’ll send your guide right away.');
    }
  }).catch(function(){ problem('We couldn’t reach the download service. Please refresh, or email me and I’ll send your guide.'); });
})();
</script>
<script src="arrows.js?v=ad91749e"></script>
