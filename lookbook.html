<body>

<section class="lbk-hero" aria-labelledby="lbkTitle">

<div class="lbk-hero-in">
<p class="lbk-eyebrow">Fall &middot; Winter</p>
<h1 class="lbk-title" id="lbkTitle"><span class="h1-kw">Personal Styling Lookbook</span><span aria-hidden="true">The</span><span aria-hidden="true">Look</span><span aria-hidden="true">book</span></h1>
<div class="lbk-stack" id="lbkStack" aria-hidden="true"></div>
</div>
</section>

<section class="lbk-looks" id="lookGrid" aria-label="The looks"></section>

<section class="lbk-end">

<p class="lbk-end-sub">Want a look like this for your next event?</p>

</section>

<script src="lookbook.js"></script>
<script>
(function(){
  var grid = document.getElementById('lookGrid'), stack = document.getElementById('lbkStack');
  function ripple(cols){
    var s = '<span class="rsq" aria-hidden="true">', k = 0;
    cols.forEach(function(c){ s += '<i style="background:' + c[1] + '">'; k++; });
    for (; k > 0; k--) s += '</i>';
    return s + '</span>';
  }
  var order = [1, 2, 3, 0];
  stack.innerHTML = order.map(function(n, p){ return '<img class="lbk-card c' + p + '" src="' + LOOKBOOK[n].image + '" alt="" loading="eager">'; }).join('');
  grid.innerHTML = LOOKBOOK.map(function(i, n){
    var num = ('0' + (n + 1)).slice(-2);
    return '<article class="lbk-look">' +
      '<button type="button" class="lbk-pic look-open" data-n="' + n + '" aria-label="View bigger: ' + i.title + '"><img src="' + i.image + '" alt="' + i.alt + '" loading="lazy"></button>' +
      '<div class="lbk-info"><p class="lbk-idx"><span>' + num + ' / ' + ('0' + LOOKBOOK.length).slice(-2) + '</span><span>' + i.tag + '</span></p>' +
      '<h2 class="lbk-name">' + i.title + '</h2>' +
      '<div class="lbk-pal">' + ripple(i.colors) + '<ul class="lbk-cols">' + i.colors.map(function(c){ return '<li><b style="background:' + c[1] + '"></b>' + c[0] + '</li>'; }).join('') + '</ul></div></div></article>';
  }).join('');
  function close(){ var m = document.getElementById('lookBox'); if (m) { m.parentNode.removeChild(m); document.body.style.overflow = ''; document.removeEventListener('keydown', esc); } }
  function esc(e){ if (e.key === 'Escape') close(); }
  grid.addEventListener('click', function(e){
    var b = e.target.closest('.look-open'); if (!b) return;
    var i = LOOKBOOK[+b.getAttribute('data-n')];
    var m = document.createElement('div'); m.id = 'lookBox'; m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true');
    m.innerHTML = '<div class="lb-in"><button type="button" class="lb-x" aria-label="Close">\u00d7</button><img src="' + i.image + '" alt="' + i.alt + '"><p>' + i.title + '</p></div>';
    m.addEventListener('click', function(ev){ if (ev.target === m || ev.target.classList.contains('lb-x')) close(); });
    document.addEventListener('keydown', esc);
    document.body.appendChild(m); document.body.style.overflow = 'hidden';
  });
})();
</script>
<script src="arrows.js?v=ad91749e"></script>
</body>
