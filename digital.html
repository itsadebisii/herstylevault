    h += '<section class="band stone wrap" style="border-radius:4px;"><p class="eyebrow center">What You Get</p><h2 class="heading center">Inside <em>' + p.name.replace(/^The /,'') + '</em></h2>' +
      '<ul class="includes-list">' + p.includes.map(function(i){ return '<li>' + i + '</li>'; }).join('') + '</ul></section>';
    h += '<section class="band wrap"><p class="eyebrow center">How It Works</p><h2 class="heading center">Three <em>simple</em> steps</h2><div class="pkg-grid">' +

    if (p.trust) h += '<section class="band stone wrap" style="border-radius:4px;"><p class="eyebrow center">Why It’s the Real Thing</p><h2 class="heading center">Not a <em>generic quiz result</em></h2><div class="quote-grid" style="grid-template-columns:1fr 1fr;">' +

      document.getElementById('peekNext').addEventListener('click', function(){ show(i + 1); });
      show(0);
    })();
